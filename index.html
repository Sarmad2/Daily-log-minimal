<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Habits and tasks, logged every day. Works offline.">
<meta name="theme-color" content="#f4f7f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1815" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Log">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/Outfit.ttf" as="font" type="font/ttf" crossorigin>
<title>Daily Log</title>
<style>
@font-face{font-family:"Outfit";src:url("fonts/Outfit.ttf") format("truetype");font-weight:100 900;font-style:normal;font-display:swap}
:root{
  --accent:#34c27a;
  --miss:#d97a6c;
  --font:"Outfit",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.22,.85,.3,1);
  --spring:cubic-bezier(.34,1.45,.64,1);
  --r-lg:22px; --r-md:15px; --r-sm:11px;
}
html[data-theme="light"]{
  --bg-a:#e6f1e9; --bg-b:#f4f7f4; --bg-c:#d9ebe4;
  --ink:#12201a; --ink-2:#4c6157; --ink-3:#7b8f85;
  --glass:rgba(255,255,255,.55); --glass-strong:rgba(255,255,255,.80); --glass-line:rgba(255,255,255,.72);
  --hairline:rgba(18,32,26,.10); --shade:rgba(18,32,26,.05); --hover:rgba(18,32,26,.045);
  --shadow:0 10px 30px -14px rgba(20,50,38,.30); --scroll:rgba(18,32,26,.16); --on-accent:#0a1712;
}
html[data-theme="dark"]{
  --bg-a:#0a1210; --bg-b:#0e1815; --bg-c:#06100c;
  --ink:#e8f2ec; --ink-2:#9fb3a9; --ink-3:#6d8279;
  --glass:rgba(255,255,255,.05); --glass-strong:rgba(255,255,255,.085); --glass-line:rgba(255,255,255,.09);
  --hairline:rgba(255,255,255,.085); --shade:rgba(255,255,255,.045); --hover:rgba(255,255,255,.055);
  --shadow:0 18px 44px -22px rgba(0,0,0,.85); --scroll:rgba(255,255,255,.14); --on-accent:#06120c;
}
html.theming *{transition:background-color .45s ease,color .45s ease,border-color .45s ease,fill .45s ease !important}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg-b);overflow:hidden}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:0}
body::before{width:52vw;height:52vw;left:-12vw;top:-16vw;background:radial-gradient(circle,var(--accent),transparent 66%);opacity:.26;animation:drift 22s ease-in-out infinite alternate}
body::after{width:46vw;height:46vw;right:-12vw;bottom:-18vw;background:radial-gradient(circle,var(--bg-c),transparent 68%);opacity:.9}
@keyframes drift{to{transform:translate(6vw,4vh) scale(1.08)}}

/* ---------------- shell ---------------- */
.app{position:relative;z-index:1;height:100vh;display:grid;grid-template-columns:238px 1fr}
aside{display:flex;flex-direction:column;gap:4px;padding:22px 16px 18px;border-right:1px solid var(--hairline);
  background:var(--glass);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%)}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 22px}
.brand .mark{width:32px;height:32px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none;
  box-shadow:0 8px 18px -8px color-mix(in srgb,var(--accent) 80%,transparent)}
.brand .mark svg{width:17px;height:17px;stroke:var(--on-accent);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.brand b{font-size:15.5px;font-weight:600;letter-spacing:-.3px;display:block;line-height:1.15}
.brand span{font-size:11.5px;color:var(--ink-3)}
#rail{position:relative}
#rail .ind{position:absolute;left:0;right:0;top:0;height:0;border-radius:var(--r-md);pointer-events:none;
  background:color-mix(in srgb,var(--accent) 16%,transparent);border:1px solid color-mix(in srgb,var(--accent) 34%,transparent);
  transition:top .42s var(--spring),height .3s var(--ease)}
.nav{position:relative;z-index:1;display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;margin-bottom:3px;
  border-radius:var(--r-md);border:1px solid transparent;background:transparent;color:var(--ink-2);font-family:var(--font);
  font-size:14px;font-weight:500;cursor:pointer;text-align:left;transition:color .2s,background .2s}
.nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;transition:transform .3s var(--spring)}
.nav kbd{margin-left:auto;font-family:var(--font);font-size:10.5px;color:var(--ink-3);border:1px solid var(--hairline);border-radius:5px;padding:1px 5px;opacity:0;transition:opacity .18s}
.nav:hover{color:var(--ink);background:var(--hover)}
.nav:hover kbd{opacity:1}
.nav:hover svg{transform:scale(1.12)}
.nav[aria-current="true"]{color:var(--ink);background:transparent}
.nav[aria-current="true"] svg{color:var(--accent)}
.spacer{flex:1}
.rail-foot{display:flex;gap:8px;padding-top:12px;border-top:1px solid var(--hairline)}
.set-row{padding:14px 0;border-bottom:1px solid var(--hairline)}
.set-row:first-of-type{padding-top:0}
.set-row .lbl{font-size:14px;margin-bottom:10px}
.set-row .lbl small{display:block;font-size:12px;color:var(--ink-3);margin-top:3px;line-height:1.45}
.tagedit .nm small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px}
.keys-list{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;font-size:13.5px;align-items:center}
.keys-list kbd{font-family:var(--font);font-size:12px;border:1px solid var(--hairline);background:var(--shade);border-radius:7px;padding:3px 9px;justify-self:start;white-space:nowrap}
.rest-card{border-color:color-mix(in srgb,var(--accent) 38%,transparent)}
.rest-row{display:flex;align-items:center;gap:14px}
.rest-row .em{font-size:26px;line-height:1}
.rest-row .tx{flex:1;min-width:0}
.day.rest{outline:1.5px dashed color-mix(in srgb,var(--ink-3) 70%,transparent);outline-offset:-4px}

main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:26px 34px 18px;border-bottom:1px solid var(--hairline)}
.topbar h1{margin:0;font-size:27px;font-weight:600;letter-spacing:-.7px;line-height:1.1}
.topbar p{margin:3px 0 0;font-size:13.5px;color:var(--ink-2)}
.topbar .acts{display:flex;gap:9px;align-items:center}
.scroll{flex:1;overflow-y:auto;padding:24px 34px 48px;overscroll-behavior:contain}
button,.chip,.nav,.day,.check,.sw{-webkit-tap-highlight-color:transparent}
.scroll::-webkit-scrollbar{width:11px}
.scroll::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:99px;border:3px solid transparent;background-clip:content-box}
.wrap{max-width:1120px;margin:0 auto}

/* ---------------- primitives ---------------- */
.card{background:var(--glass);border:1px solid var(--glass-line);
  backdrop-filter:blur(22px) saturate(165%);-webkit-backdrop-filter:blur(22px) saturate(165%);
  border-radius:var(--r-lg);box-shadow:var(--shadow);padding:22px}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
.card-head h2{margin:0;font-size:15.5px;font-weight:600;letter-spacing:-.2px}
.card-head span{font-size:12.5px;color:var(--ink-3)}
.sub{font-size:13px;color:var(--ink-3);margin:0;line-height:1.55}
.cols{display:grid;gap:18px;align-items:start}
.cols.a{grid-template-columns:352px minmax(0,1fr)}
.cols.b{grid-template-columns:minmax(0,1fr) 336px}
.cols.c{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols.e{grid-template-columns:repeat(4,minmax(0,1fr))}
.stack>*+*{margin-top:18px}
.mt{margin-top:18px}

.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--hairline);background:var(--glass-strong);
  color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:background .18s,transform .2s var(--spring)}
.icon-btn:hover{background:var(--hover)}
.icon-btn:active{transform:scale(.9)}
.icon-btn:disabled{opacity:.35;cursor:default}
.icon-btn.sm{width:30px;height:30px;border-radius:9px}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.sm svg{width:15px;height:15px}
.btn{padding:11px 18px;border-radius:13px;border:1px solid transparent;background:var(--accent);color:var(--on-accent);
  font-family:var(--font);font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:filter .18s,transform .2s var(--spring),box-shadow .2s}
.btn:hover{filter:brightness(1.07);box-shadow:0 8px 20px -10px color-mix(in srgb,var(--accent) 80%,transparent)}
.btn:active{transform:scale(.96)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.ghost{background:var(--shade);color:var(--ink);border-color:var(--hairline)}
.btn.ghost:hover{background:var(--hover);filter:none;box-shadow:none}
.btn.danger{background:transparent;color:var(--miss);border-color:color-mix(in srgb,var(--miss) 42%,transparent)}
.btn.danger:hover{background:color-mix(in srgb,var(--miss) 12%,transparent);filter:none;box-shadow:none}
.btn.wide{width:100%}
.btn.tiny{padding:7px 12px;font-size:12px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none;box-shadow:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

input[type=text],input[type=date],select{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--hairline);
  background:var(--glass-strong);color:var(--ink);font-family:var(--font);font-size:14px;outline:none;transition:border-color .18s,box-shadow .18s}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
input[type=color]{width:32px;height:32px;padding:0;border-radius:9px;border:1px solid var(--hairline);background:transparent;cursor:pointer;flex:none}
label.fld{display:block;font-size:12.5px;color:var(--ink-2);margin:0 0 7px 2px}
.fld-wrap{margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--hairline);background:var(--shade);
  font-family:var(--font);font-size:12.5px;color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  transition:background .18s,border-color .18s,transform .2s var(--spring)}
.chip:hover{background:var(--hover)}
.chip:active{transform:scale(.94)}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 20%,transparent);border-color:var(--accent);color:var(--ink)}
.chip i{width:8px;height:8px;border-radius:50%;display:block;flex:none}
.chip.sm{padding:6px 12px;font-size:12px}
.pill{font-size:11.5px;padding:4px 11px;border-radius:999px;background:var(--shade);color:var(--ink-2);white-space:nowrap;font-weight:500;flex:none}

/* ---------------- ring ---------------- */
.ring-wrap{display:flex;align-items:center;gap:22px}
.ring{position:relative;width:142px;height:142px;flex:none}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring circle{fill:none;stroke-linecap:round}
.ring .track{stroke:var(--shade);stroke-width:12}
.ring .bar{stroke:var(--accent);stroke-width:12;transition:stroke-dashoffset 1s var(--ease);
  filter:drop-shadow(0 0 6px color-mix(in srgb,var(--accent) 45%,transparent))}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .mid b{font-size:36px;font-weight:600;letter-spacing:-1.8px;font-variant-numeric:tabular-nums;line-height:1}
.ring .mid small{font-size:11.5px;color:var(--ink-3);display:block;margin-top:5px}
.facts{display:flex;flex-direction:column;gap:10px;min-width:0}
.fact{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink-2)}
.fact b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;min-width:16px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.moods{display:flex;gap:8px}
.mood{flex:1;border:1px solid transparent;background:var(--shade);border-radius:13px;padding:11px 2px 8px;font-size:22px;
  cursor:pointer;text-align:center;line-height:1;transition:background .18s,transform .25s var(--spring)}
.mood small{display:block;font-size:10px;margin-top:6px;color:var(--ink-3);font-family:var(--font)}
.mood:hover{background:var(--hover);transform:translateY(-2px)}
.mood:active{transform:scale(.9)}
.mood[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 20%,transparent);border-color:color-mix(in srgb,var(--accent) 46%,transparent);transform:translateY(-2px)}

/* ---------------- rows ---------------- */
.section-label{font-size:12.5px;color:var(--ink-3);margin:0 0 10px 2px;font-weight:500;display:flex;justify-content:space-between;align-items:center}
.group-head{display:flex;align-items:center;gap:9px;margin:20px 2px 9px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.group-head:first-child{margin-top:0}
.group-head .count{margin-left:auto;font-weight:500;color:var(--ink-3);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:14px;margin-bottom:9px;padding:12px 14px 12px 16px;border-radius:var(--r-md);
  background:var(--glass-strong);border:1px solid var(--glass-line);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:background .18s,border-color .18s,transform .2s var(--ease)}
.row.live:hover{background:var(--hover);transform:translateX(2px)}
.row .title{font-size:14.5px;font-weight:500;flex:1;min-width:0;cursor:pointer}
.row:not(.live) .title{cursor:default}
.row .title span{display:block;font-size:11.5px;color:var(--ink-3);font-weight:400;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.is-done,.row.is-mini{background:var(--shade);border-color:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
.row.is-done .title,.row.is-mini .title{color:var(--ink-2)}
.row.is-done .title>:first-child{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.row.is-miss{background:transparent;border-color:color-mix(in srgb,var(--miss) 26%,transparent)}
.row.is-miss .title{color:var(--ink-2)}
.row .tools{display:flex;gap:6px;opacity:0;transform:translateX(6px);transition:opacity .18s,transform .25s var(--ease)}
.row:hover .tools,.row:focus-within .tools{opacity:1;transform:none}
.tbtn{height:28px;padding:0 10px;border-radius:9px;border:1px solid var(--hairline);background:var(--glass-strong);
  font-family:var(--font);font-size:12px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px;cursor:pointer;
  transition:color .15s,border-color .15s,transform .2s var(--spring)}
.tbtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tbtn:hover{color:var(--accent);border-color:var(--accent)}
.tbtn:active{transform:scale(.92)}

.check{width:25px;height:25px;border-radius:8px;border:2px solid var(--ink-3);background:transparent;display:grid;
  place-items:center;cursor:pointer;flex:none;padding:0;position:relative;
  transition:background .2s var(--ease),border-color .2s,transform .2s var(--spring)}
.check:hover{border-color:var(--accent);transform:scale(1.06)}
.check svg{width:14px;height:14px;stroke:var(--on-accent);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
  opacity:0;transform:scale(.4) rotate(-12deg);transition:all .3s var(--spring)}
.check[data-state="done"]{background:var(--accent);border-color:var(--accent)}
.check[data-state="done"] svg{opacity:1;transform:none}
.check[data-state="mini"]{border-color:var(--accent);background:linear-gradient(135deg,var(--accent) 0 50%,transparent 50% 100%)}
.check[data-state="miss"]{border-color:color-mix(in srgb,var(--miss) 60%,transparent)}
.check[data-state="miss"]::after{content:"";position:absolute;width:11px;height:2px;border-radius:2px;background:var(--miss)}
.check.ro{cursor:default}
.check.ro:hover{border-color:var(--ink-3);transform:none}
.check.ro[data-state="done"]:hover,.check.ro[data-state="mini"]:hover{border-color:var(--accent)}
.empty{text-align:center;padding:38px 16px}
.empty p{margin:0 0 5px;font-size:15px;font-weight:500}
.empty small{color:var(--ink-3);font-size:13px}

/* ---------------- month ---------------- */
.month-nav{display:flex;align-items:center;gap:10px}
.month-nav b{font-size:15.5px;font-weight:600;min-width:150px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:8px}
.dow span{text-align:center;font-size:11px;color:var(--ink-3)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{aspect-ratio:1.12;border-radius:12px;border:1px solid transparent;background:var(--shade);display:flex;flex-direction:column;
  align-items:flex-start;justify-content:space-between;padding:8px 9px;font-size:12.5px;color:var(--ink-2);cursor:pointer;
  font-variant-numeric:tabular-nums;font-family:var(--font);transition:transform .25s var(--spring),box-shadow .2s}
.day:hover{transform:translateY(-3px) scale(1.03);box-shadow:var(--shadow)}
.day.blank{background:transparent;cursor:default;pointer-events:none}
.day.today{border-color:var(--accent);font-weight:600}
.day.sel{box-shadow:0 0 0 2px var(--accent)}
.day.future{opacity:.3;pointer-events:none}
.day.has{color:var(--on-accent)}
.day em{font-size:9.5px;font-style:normal;opacity:.72;font-weight:500}
.legend{display:flex;align-items:center;gap:7px;margin-top:18px;font-size:11.5px;color:var(--ink-3)}
.legend i{width:16px;height:16px;border-radius:5px;display:block}

/* ---------------- stats ---------------- */
.metric{display:flex;flex-direction:column;gap:6px}
.metric .big{font-size:46px;font-weight:600;letter-spacing:-2.6px;line-height:1;font-variant-numeric:tabular-nums}
.metric .cap{font-size:13px;color:var(--ink-3)}
.delta{font-size:12.5px;font-weight:500;line-height:1.4}
.delta.up{color:var(--accent)}
.delta.down{color:var(--miss)}
.delta.flat{color:var(--ink-3)}
.chart{display:flex;align-items:flex-end;gap:4px;height:172px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:100%;position:relative}
.col i{display:block;border-radius:4px;min-height:2px}
.col .d{background:var(--accent)}
.col .h{background:color-mix(in srgb,var(--accent) 50%,transparent)}
.col .m{background:color-mix(in srgb,var(--miss) 55%,transparent)}
.col .z{background:var(--shade);height:3px;border-radius:3px}
.col:hover .tip{opacity:1;transform:translate(-50%,-6px)}
.tip{position:absolute;bottom:100%;left:50%;transform:translate(-50%,0);opacity:0;pointer-events:none;
  background:var(--glass-strong);border:1px solid var(--glass-line);backdrop-filter:blur(14px);border-radius:9px;
  padding:6px 10px;font-size:11.5px;white-space:nowrap;box-shadow:var(--shadow);transition:all .16s var(--ease);z-index:3}
.axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);margin-top:12px}
.keys{display:flex;gap:16px;font-size:12px;color:var(--ink-3);margin-top:6px;flex-wrap:wrap}
.keys span{display:inline-flex;align-items:center;gap:6px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;text-align:center}
.wk .bar{height:104px;background:var(--shade);border-radius:8px;position:relative;overflow:hidden;display:block}
.wk .bar i{position:absolute;left:0;right:0;bottom:0;background:var(--accent);display:block}
.wk .lb{font-size:11.5px;color:var(--ink-3);margin-top:8px;display:block}
.wk .pc{font-size:12px;font-weight:600;margin-top:3px;display:block;font-variant-numeric:tabular-nums}
.wk .em{font-size:20px;margin-top:8px;display:block}
.tagrow{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.tagrow .name{font-size:13.5px;width:90px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:8px}
.tagrow .name i{width:8px;height:8px;border-radius:50%;flex:none}
.lane{flex:1;min-width:0}
.tagbar{height:10px;border-radius:99px;overflow:hidden;display:flex;background:var(--shade);min-width:10px}
.tagbar i{display:block;height:100%}

.hrow{display:flex;align-items:center;gap:12px;margin-bottom:6px}

.links .lk .ar.down{background:color-mix(in srgb,var(--miss) 16%,transparent);color:var(--miss)}

.links .lk .df{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;font-weight:500;color:var(--ink-3);text-align:left;padding:0 10px 10px 0}
th:last-child,td:last-child{text-align:right;padding-right:0}

td.name small{display:block;font-size:11.5px;font-weight:400;color:var(--ink-3);margin-top:2px}
td small.mi{color:var(--ink-3);font-size:11.5px;margin-left:4px}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--hover)}
.mini-track{width:64px;height:7px;border-radius:99px;background:var(--shade);overflow:hidden;display:inline-block;vertical-align:middle;margin-right:9px}
.mini-track i{display:block;height:100%;background:var(--accent)}
.flame{color:var(--accent);font-weight:600}

.switch{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--hairline)}
.switch .lbl{font-size:14px}
.switch .lbl small{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
.toggle{width:48px;height:28px;border-radius:99px;background:var(--shade);border:1px solid var(--hairline);position:relative;cursor:pointer;flex:none;padding:0}
.toggle i{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--ink-3);transition:all .3s var(--spring)}
.toggle[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 28%,transparent);border-color:var(--accent)}
.toggle[aria-pressed="true"] i{left:22px;background:var(--accent)}
.swatches{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;width:100%;}
.sw{width:100%;min-width:0;min-height:54px;border-radius:13px;border:1px solid color-mix(in srgb,var(--ink) 12%,transparent);cursor:pointer;transition:transform .2s var(--spring),border-color .2s,box-shadow .2s;position:relative;display:flex;align-items:flex-end;justify-content:center;padding:0 6px 7px;background:var(--swatch);color:#fff;font:600 10px var(--font);text-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw:hover{transform:translateY(-2px)}
.sw[aria-pressed="true"]{border:2px solid var(--ink);box-shadow:0 0 0 2px var(--bg-b),0 0 0 4px var(--ink)}
.sw.custom{align-items:center;color:var(--ink);text-shadow:none;background:var(--shade)}
.settings-dialog{overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;box-sizing:border-box;max-width:calc(100vw - 28px)}
.settings-dialog *{box-sizing:border-box;min-width:0;max-width:100%}
.settings-dialog .settings-theme,.settings-dialog .chips{width:100%;}
.settings-dialog .chips{display:flex;flex-wrap:wrap;gap:8px}
.settings-dialog .chips .chip{max-width:100%;}
.settings-dialog .tagadd{min-width:0}
.settings-dialog .tagadd input{min-width:0;flex:1}

.tagedit{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--hairline)}
.tagedit .nm{flex:1;font-size:13.5px}
.tagadd{display:flex;gap:8px;margin-top:12px}

/* ---------------- dialog / toast ---------------- */
.scrim{position:fixed;inset:0;background:rgba(6,16,12,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:40;opacity:0;pointer-events:none;transition:opacity .28s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.dialog{position:fixed;left:50%;top:50%;z-index:41;width:min(456px,calc(100vw - 40px));max-height:88vh;overflow-y:auto;overflow-x:hidden;
  transform:translate(-50%,-47%) scale(.94);opacity:0;pointer-events:none;background:var(--glass-strong);
  border:1px solid var(--glass-line);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
  border-radius:24px;padding:26px;box-shadow:0 40px 80px -30px rgba(0,0,0,.55);transition:opacity .22s var(--ease),transform .42s var(--spring)}
.dialog.wide{width:min(560px,calc(100vw - 40px))}
.dialog.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.dialog h3{margin:0 0 4px;font-size:20px;font-weight:600;letter-spacing:-.4px}
.dialog .sub{margin-bottom:20px}
.settings-dialog{width:min(620px,calc(100vw - 28px));padding:22px;max-height:84vh}
.settings-hero{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding-bottom:17px;margin-bottom:8px;border-bottom:1px solid var(--hairline)}
.settings-hero h3{font-size:22px;margin-bottom:5px}
.settings-section{padding:15px 0;border-bottom:1px solid var(--hairline)}
.settings-section:last-of-type{border-bottom:0}
.settings-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:11px}
.settings-section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.settings-section-desc{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.settings-theme{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.settings-theme .chip{justify-content:center;min-height:38px}
.settings-footer{display:flex;justify-content:flex-end;padding-top:15px}
@media(max-width:560px){.settings-dialog{padding:18px}.settings-theme{grid-template-columns:1fr 1fr}.settings-theme .chip:last-child{grid-column:1/-1}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc-prev{display:grid;place-items:center;min-height:200px;margin-bottom:16px}
.sc-prev img{max-width:100%;max-height:52vh;border-radius:16px;box-shadow:0 20px 40px -20px rgba(0,0,0,.6);animation:rise .5s var(--ease) both}
.toast{position:fixed;right:26px;bottom:26px;z-index:50;padding:12px 18px;border-radius:14px;font-size:13.5px;font-weight:500;
  background:var(--glass-strong);border:1px solid var(--glass-line);color:var(--ink);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:var(--shadow);opacity:0;transform:translateY(14px) scale(.96);pointer-events:none;transition:opacity .25s var(--ease),transform .4s var(--spring)}
.toast.on{opacity:1;transform:none}
.toast.action{padding:7px 8px 7px 14px;display:flex;align-items:center;gap:12px}
.toast .toast-act{border:1px solid var(--hairline);background:var(--shade);color:var(--ink);border-radius:9px;padding:6px 10px;font:600 12px var(--font);cursor:pointer}
.toast .toast-act:hover{background:var(--hover)}
.quickbar{display:flex;gap:9px;align-items:center;margin-bottom:14px}
.quickbar .searchbox{position:relative;flex:1;min-width:180px}
.quickbar .searchbox svg{position:absolute;left:12px;top:50%;width:16px;height:16px;transform:translateY(-50%);stroke:var(--ink-3);fill:none;stroke-width:1.8;pointer-events:none}
.quickbar input{padding-left:38px}
.quickbar .qadd{display:flex;gap:8px;flex:none}
.quickbar .qadd input{width:210px}
.quickbar .qhint{font-size:11px;color:var(--ink-3);white-space:nowrap}
.filterbar{display:flex;gap:7px;flex-wrap:wrap;margin:-2px 0 14px}
.filterbar .chip{padding:6px 11px}

.quick-empty{margin-top:8px}
@media(max-width:620px){
  .quickbar{align-items:stretch;flex-direction:column}
  .quickbar .qadd{width:100%}
  .quickbar .qadd input{width:auto;flex:1}
  .quickbar .qhint{display:none}
}

/* ---------------- focus timer ---------------- */
.focus{position:fixed;inset:0;z-index:45;display:grid;place-items:center;
  background:color-mix(in srgb,var(--bg-b) 70%,transparent);backdrop-filter:blur(28px) saturate(150%);-webkit-backdrop-filter:blur(28px) saturate(150%);
  opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
.focus.on{opacity:1;pointer-events:auto}
.focus .panel{width:min(470px,calc(100vw - 40px));text-align:center;transform:scale(.94) translateY(12px);transition:transform .5s var(--spring)}
.focus.on .panel{transform:none}
.fhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.fkind{font-size:12.5px;color:var(--ink-3);letter-spacing:.4px;text-transform:uppercase;font-weight:600}
.ftitle{margin:6px 0 10px;font-size:26px;font-weight:600;letter-spacing:-.6px}
.fring{position:relative;width:280px;height:280px;margin:22px auto 20px}
.fring svg{transform:rotate(-90deg);width:100%;height:100%;position:relative}
.fring circle{fill:none;stroke-linecap:round}
.fring .track{stroke:var(--shade);stroke-width:10}
.fring .bar{stroke:var(--accent);stroke-width:10;transition:stroke-dashoffset .35s linear}
.brk .fring .bar{stroke:#6aa8f0}
.fring .glow{position:absolute;inset:26px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 30%,transparent),transparent 70%);opacity:0;transition:opacity .6s}
.running .fring .glow{opacity:1;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.08);opacity:.55}}
.fring .mid{position:absolute;inset:0;display:grid;place-content:center}
.fring .time{font-size:64px;font-weight:600;letter-spacing:-3px;font-variant-numeric:tabular-nums;line-height:1}
.fring .state{font-size:13px;color:var(--ink-3);margin-top:10px}
.fpresets{justify-content:center;margin-bottom:18px}
.fctl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.fauto{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:20px;font-size:13px;color:var(--ink-2);cursor:pointer}
.fmeta{margin-top:16px}
.focus-pill{position:fixed;left:24px;bottom:24px;z-index:44;display:flex;align-items:center;gap:9px;padding:10px 16px 10px 13px;
  border-radius:99px;border:1px solid var(--glass-line);background:var(--glass-strong);color:var(--ink);font-family:var(--font);font-size:13px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--shadow);cursor:pointer;animation:rise .4s var(--spring) both}
.focus-pill b{font-variant-numeric:tabular-nums;font-weight:600}
.focus-pill span:last-child{color:var(--ink-3);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdot{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.pdot.live{background:var(--accent);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

/* ---------------- motion ---------------- */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
@keyframes growx{from{transform:scaleX(0)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes cellin{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.32)}100%{transform:scale(1)}}
@keyframes leave{to{opacity:0;transform:translateX(28px) scale(.98)}}
@keyframes leaveb{to{opacity:0;transform:translateX(-20px)}}
@keyframes arrive{0%{opacity:0;transform:translateY(-8px) scale(.97);box-shadow:0 0 0 2px var(--accent)}60%{box-shadow:0 0 0 2px var(--accent)}100%{opacity:1;transform:none;box-shadow:0 0 0 0 transparent}}
#view.anim .card,#view.anim .row,#view.anim .group-head,#view.anim .section-label,#view.anim .hrow{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0) * 34ms)}
#view.anim .col i{animation:grow .7s var(--ease) both;transform-origin:bottom;animation-delay:calc(var(--j,0) * 14ms + 160ms)}
#view.anim .wk .bar i{animation:grow .8s var(--ease) both;transform-origin:bottom;animation-delay:220ms}
#view.anim .tagbar{animation:growx .8s var(--ease) both;transform-origin:left;animation-delay:220ms}
#view.anim .mini-track i{animation:growx .8s var(--ease) both;transform-origin:left;animation-delay:300ms}
#view.anim .trend .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s var(--ease) .2s forwards}
#view.anim .trend .ar{animation:fade 1s ease .5s both}
#view.anim .day{animation:cellin .45s var(--spring) both;animation-delay:calc(var(--k,0) * 11ms + 80ms)}
.check.pop{animation:pop .42s var(--spring)}
.row.leaving{animation:leave .26s var(--ease) forwards}
.row.leaving-back{animation:leaveb .22s var(--ease) forwards}
.row.arrive{animation:arrive .8s var(--ease) both}


@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important;animation-duration:.01ms !important;animation-delay:0ms !important}}
@media (max-width:1080px){.cols.a,.cols.b{grid-template-columns:minmax(0,1fr)}.cols.e{grid-template-columns:repeat(2,minmax(0,1fr))}.app{grid-template-columns:210px 1fr}}
@media (max-width:820px){
  .app{grid-template-columns:68px 1fr}
  .brand b,.brand span,.nav span,.nav kbd{display:none}
  .brand{justify-content:center;padding-left:0}
  .nav{justify-content:center;padding:11px 0}
  .rail-foot{flex-direction:column}
  .cols.c,.cols.e{grid-template-columns:minmax(0,1fr)}
  .topbar,.scroll{padding-left:20px;padding-right:20px}
  .hrow .hn{width:100px}
}
@media (hover:none){
  /* touch screens have no hover, so row tools must always be reachable */
  .row .tools{opacity:1;transform:none}
}
@media(max-width:700px){
  /* ---- layout: give the scroller a real height so pages actually scroll ---- */
  html,body{height:100%;overflow:hidden;overflow-x:hidden}
  .app{display:block;height:100dvh}
  main{height:100%;padding-bottom:calc(68px + env(safe-area-inset-bottom,0px))}
  .scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 13px 28px}
  .wrap{max-width:none}
  .cols.a,.cols.b,.cols.c,.cols.e{grid-template-columns:minmax(0,1fr)}
  .stack>*+*,.mt{margin-top:13px}

  /* ---- bottom tab bar ---- */
  aside{position:fixed;left:0;right:0;bottom:0;top:auto;height:calc(68px + env(safe-area-inset-bottom,0px));padding:0 6px env(safe-area-inset-bottom,0px);z-index:30;display:flex;flex-direction:row;align-items:center;gap:4px;border-right:0;border-top:1px solid var(--glass-line);background:var(--glass-strong);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%)}
  aside .brand,aside .spacer,aside .ind{display:none}
  aside nav{display:flex;flex:1;min-width:0;height:100%;padding:0;overflow:hidden}
  aside nav #navs{display:flex;align-items:center;width:100%;gap:2px}
  .nav{height:52px;min-width:0;flex:1;justify-content:center;padding:6px 2px;margin:0;border-radius:13px;flex-direction:column;gap:3px}
  .nav span{display:block!important;font-size:9.5px;line-height:1;white-space:nowrap}
  .nav kbd{display:none!important}
  .nav svg{width:19px;height:19px}
  .rail-foot{display:flex;flex-direction:row;flex:none;gap:5px;margin:0;padding:0 0 0 4px;border-top:0;border-left:1px solid var(--hairline)}
  .rail-foot .icon-btn{width:40px;height:40px}

  /* ---- type scale: tuned for a ~360px wide screen ---- */
  .topbar{flex-wrap:wrap;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 10px;background:color-mix(in srgb,var(--bg-b) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
  .topbar h1{font-size:22px;letter-spacing:-.5px}
  .topbar p{font-size:12.5px}

  .card{padding:15px;border-radius:18px}
  .card-head{margin-bottom:12px}
  .card-head h2{font-size:14.5px}
  .card-head span{font-size:11.5px}

  /* ---- task rows: title gets the full width, buttons sit on their own line ---- */
  .row{flex-wrap:wrap;gap:0 11px;padding:11px 12px 11px 13px}
  .row .title{flex:1 1 0;min-width:0;font-size:14px}

  /* ---- everything else that needs to fit ---- */
  .ring{width:118px;height:118px}
  .ring .mid b{font-size:30px}
  .ring-wrap{gap:16px}
  .metric .big{font-size:36px;letter-spacing:-1.8px}
  table{font-size:12.5px}
  th,td{padding-right:7px}
  td.name{font-size:12.5px}

  .toast{left:14px;right:14px;bottom:calc(80px + env(safe-area-inset-bottom,0px));text-align:center}
  .focus-pill{left:14px;bottom:calc(80px + env(safe-area-inset-bottom,0px))}
}

/* ============ touch devices (phones in any orientation, tablets) ============ */

@media (hover:none) and (pointer:coarse){
  .desk-only{display:none !important}

}

/* ============ phone, portrait ============ */
@media (max-width:700px){
  /* top: title + toggles on one line, actions below */
  .topbar{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"t g" "a a";align-items:start;column-gap:10px;row-gap:10px}
  .topbar .ttl{grid-area:t;min-width:0}
  .topbar .ttog{grid-area:g;padding-top:2px}
  .topbar .acts{grid-area:a;justify-self:start;flex-wrap:wrap}
  .topbar .acts:empty{display:none}
  .topbar p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* Instagram-style tab bar: icons only, no pills, active icon is bolder */

<script>
/* ============================ storage ============================ */
const mem = new Map();
function probeClaude(){ try{ return !!(window.storage && typeof window.storage.get === "function"); }catch(e){ return false; } }
function probeLocal(){ try{ localStorage.setItem("dl:probe","1"); localStorage.removeItem("dl:probe"); return true; }catch(e){ return false; } }
const BACKEND = probeClaude() ? "claude" : probeLocal() ? "local" : "memory";
const BACKEND_LABEL = { claude:"Claude storage", local:"this browser's local storage", memory:"memory only — nothing is saved" }[BACKEND];
const S = {
  async get(k){
    try{
      if(BACKEND==="claude"){ const r = await window.storage.get(k); return r ? JSON.parse(r.value) : null; }
      const raw = BACKEND==="local" ? localStorage.getItem(k) : (mem.get(k) ?? null);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  },
  async set(k,v){
    const s = JSON.stringify(v);
    try{
      if(BACKEND==="claude"){ await window.storage.set(k,s,false); return true; }
      if(BACKEND==="local"){ localStorage.setItem(k,s); return true; }
      mem.set(k,s); return true;
    }catch(e){ return false; }
  },
  async del(k){
    try{
      if(BACKEND==="claude"){ await window.storage.delete(k,false); return; }
      if(BACKEND==="local"){ localStorage.removeItem(k); return; }
      mem.delete(k);
    }catch(e){}
  },
  async keys(prefix){
    try{
      if(BACKEND==="claude"){ const r = await window.storage.list(prefix,false); return r && r.keys ? r.keys : []; }
      if(BACKEND==="local") return Object.keys(localStorage).filter(k=>k.startsWith(prefix));
      return [...mem.keys()].filter(k=>k.startsWith(prefix));
    }catch(e){ return []; }
  }
};
const K = { settings:"dl:settings", tasks:"dl:tasks", log:ym=>`dl:log:${ym}` };

/* ============================ helpers ============================ */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,"0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const ymOf = s => s.slice(0,7);
const shift = (d,n) => { const x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x; };
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const wait = ms => new Promise(r=>setTimeout(r,ms));
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const DOW_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DOW_ORDER = [1,2,3,4,5,6,0];
let DAY_END_H = 0;                               // "Day ends at" — 0 = midnight, up to 4 am
let WEEK_START = 1;                              // 1 = Monday, 0 = Sunday
const nowD = () => new Date(Date.now() - DAY_END_H*3600e3);
const today = () => keyOf(nowD());
const dowOrder = () => Array.from({length:7}, (_,i)=>(WEEK_START+i)%7);
const prettyDate = s => { const d=parseKey(s); return `${DAYS[d.getDay()].slice(0,3)}, ${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`; };
const longDate = s => { const d=parseKey(s); return `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
const fmtMin = m => m<60 ? `${m}m` : `${Math.floor(m/60)}h${m%60?` ${m%60}m`:""}`;
const reduced = (()=>{ try{ return window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } })();

const CHECK = '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>';
const TIMER = '<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>';
const SHARE = '<svg viewBox="0 0 24 24"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v13"/></svg>';

const MOODS = [["rough","😖"],["low","😕"],["fine","🙂"],["good","😄"],["great","🤩"]];
const MOOD_VAL = { rough:1, low:2, fine:3, good:4, great:5 };
const VAL = { done:1, mini:.5, miss:0 };
const SWATCHES = [
  {name:"Emerald", color:"#22c55e"},
  {name:"Ocean", color:"#0ea5e9"},
  {name:"Indigo", color:"#6366f1"},
  {name:"Violet", color:"#8b5cf6"},
  {name:"Rose", color:"#f43f5e"},
  {name:"Coral", color:"#f97316"},
  {name:"Amber", color:"#eab308"},
  {name:"Teal", color:"#14b8a6"},
  {name:"Slate", color:"#64748b"}
];
const DEFAULT_TAGS = [
  { name:"health", color:"#34a97b" }, { name:"education", color:"#4d8df6" }, { name:"work", color:"#e07a3f" },
  { name:"home", color:"#a96fd8" },   { name:"mind", color:"#22b5c6" },      { name:"money", color:"#d2a24c" }
];

/* ============================ state ============================ */
const state = {
  settings:{ accent:"#34c27a", mood:true, startTab:"today", theme:"system", lastRun:null, tags:null, groupByTag:true },
  tasks:[], logs:{}, loaded:new Set(),
  tab:"today", cursor:new Date(), selDay:null, range:30, dayKey:today(),
  enter:false, lastPct:null, justDone:null,
  taskQuery:"", taskTag:"all"
};
let saveTimer = {};

function tagList(){ return state.settings.tags && state.settings.tags.length ? state.settings.tags : DEFAULT_TAGS; }
function tagColor(name){
  const t = tagList().find(x => x.name === name);
  if(t) return t.color;
  let h = 0; for(const ch of String(name||"")) h = (h*31 + ch.charCodeAt(0)) % 360;
  return `hsl(${h} 42% 52%)`;
}
function tagPill(name){
  const c = tagColor(name);
  return `<span class="pill" style="background:color-mix(in srgb,${c} 17%,transparent);color:color-mix(in srgb,${c} 68%,var(--ink))">${esc(name)}</span>`;
}
const findTask = id => state.tasks.find(t=>t.id===id);

async function ensureMonth(ym){
  if(state.loaded.has(ym)) return;
  const data = await S.get(K.log(ym));
  if(data) Object.assign(state.logs, data);
  state.loaded.add(ym);
}
function queueSaveMonth(ym){
  clearTimeout(saveTimer[ym]);
  saveTimer[ym] = setTimeout(()=>{
    const bucket = {};
    for(const k in state.logs) if(k.startsWith(ym)) bucket[k] = state.logs[k];
    S.set(K.log(ym), bucket);
  }, 260);
}
const saveTasks = () => S.set(K.tasks, state.tasks);
const saveSettings = () => S.set(K.settings, state.settings);
function dayLog(date){
  if(!state.logs[date]) state.logs[date] = { mood:null, e:{} };
  if(!state.logs[date].e) state.logs[date].e = {};
  return state.logs[date];
}

/* ============================ schedules ============================ */
function activeOn(t, ds){ return t.created<=ds && (!t.removed || t.removedAt>ds); }
function isWeekly(t){ return t.repeat!=="once" && !!t.sched && t.sched.type==="weekly"; }
function isRest(ds){ return (state.settings.rest||[]).some(p=>ds>=p.from && (!p.to || ds<=p.to)); }
function currentRest(){ const t = today(); return (state.settings.rest||[]).find(p=>t>=p.from && (!p.to || t<=p.to)) || null; }
function endRest(){
  const s = state.settings, r = currentRest(); if(!r) return;
  const y = keyOf(shift(parseKey(today()), -1));
  if(y < r.from) s.rest = s.rest.filter(p=>p!==r); else r.to = y;
  saveSettings(); toast("Welcome back 💪 today counts again");
}
function isExpected(t, ds){
  if(t.repeat==="once") return t.date===ds && !t.removed;
  if(isRest(ds)) return false;                    // rest days: nothing is due, nothing can be missed
  if(!activeOn(t, ds)) return false;
  const s = t.sched;
  if(!s || s.type==="daily") return true;
  if(s.type==="days") return s.days.includes(parseKey(ds).getDay());
  return false;                                   // weekly: never "due" on a specific day
}
function expected(ds){ return state.tasks.filter(t=>isExpected(t, ds)); }
const scheduled = expected;
function weekStart(ds){ const d=parseKey(ds); return keyOf(shift(d, -((d.getDay()-WEEK_START+7)%7))); }
function weekQuota(t, mon){
  let active = 0;
  for(let i=0;i<7;i++){ const k = keyOf(shift(parseKey(mon), i)); if(activeOn(t, k) && !isRest(k)) active++; }
  return active ? Math.ceil(t.sched.n * active / 7) : 0;
}
function weekCount(t, mon, until){
  let c = 0;
  for(let i=0;i<7;i++){
    const ds = keyOf(shift(parseKey(mon), i));
    if(ds > until) break;
    const s = statusOf(ds, t.id);
    if(s==="done" || s==="mini") c++;
  }
  return c;
}
function weeklyActive(ds){ return state.tasks.filter(t=>isWeekly(t) && activeOn(t, ds)); }
function schedText(t){
  if(t.repeat==="once") return `On ${prettyDate(t.date)}`;
  const s = t.sched;
  if(!s || s.type==="daily") return "Every day";
  if(s.type==="weekly") return `${s.n}× a week`;
  const d = [...s.days].sort((a,b)=>dowOrder().indexOf(a)-dowOrder().indexOf(b));
  const k = d.join(",");
  if(k==="1,2,3,4,5") return "Weekdays";
  if(k==="6,0") return "Weekends";
  if(d.length===7) return "Every day";
  return d.map(x=>DOW_SHORT[x]).join(" · ");
}

/* ============================ statuses ============================ */
/* "done" | "mini" | "miss" | null. "open" entries carry only a note or focus time.
   Legacy "skip" entries from earlier versions read as "miss". */
function statusOf(date, id){
  const L = state.logs[date]; if(!L || !L.e || !L.e[id]) return null;
  const s = L.e[id].s;
  if(s==="done" || s==="mini") return s;
  if(s==="open") return null;
  return "miss";
}
/* all outcomes for one task on one day — includes weekly-target shortfalls filed on Sundays */
function taskStatuses(ds, id){
  const L = state.logs[ds]; if(!L || !L.e) return [];
  const out = []; const s = statusOf(ds, id); if(s) out.push(s);
  const pre = id + "~w";
  for(const k in L.e) if(k.startsWith(pre)) out.push("miss");
  return out;
}
function focusMinutes(ds, id){
  const L = state.logs[ds]; if(!L || !L.e) return 0;
  if(id) return (L.e[id] && L.e[id].f) || 0;
  let m = 0; for(const k in L.e) m += L.e[k].f || 0; return m;
}
function setMark(date, task, s){
  const L = dayLog(date);
  const prev = L.e[task.id] || {};
  const n = prev.n || "", f = prev.f || 0;
  if(s) L.e[task.id] = n ? { s, n, f, t:task.title, g:task.tag } : { s, f, t:task.title, g:task.tag };
  else if(n || f) L.e[task.id] = { s:"open", n, f, t:task.title, g:task.tag };
  else delete L.e[task.id];
  queueSaveMonth(ymOf(date));
}
const setDone = (date, task, on) => setMark(date, task, on ? "done" : null);

/* Closed days are read strictly from what was recorded, so editing a schedule
   never rewrites history. Today (and later) uses the live schedule. */
function dayStat(date){
  const ids = new Set();
  if(date >= today()) expected(date).forEach(t=>ids.add(t.id));
  const L = state.logs[date];
  if(L && L.e) for(const id in L.e) if(statusOf(date, id)) ids.add(id);
  let done=0, mini=0, miss=0, open=0;
  ids.forEach(id=>{
    const s = statusOf(date, id);
    if(s==="done") done++; else if(s==="mini") mini++; else if(s==="miss") miss++; else open++;
  });
  return { total:ids.size, done, mini, miss, open, score:done + mini*.5 };
}

/* ============================ midnight rollover ============================ */
async function rollover(){
  const t0 = today();
  const last = state.settings.lastRun;
  if(!last){ state.settings.lastRun = t0; await saveSettings(); return 0; }
  if(last >= t0) return 0;
  let cur = parseKey(last), n = 0, guard = 0;
  const stop = parseKey(t0), touched = new Set();
  while(cur < stop && guard++ < 70){
    const ds = keyOf(cur);
    await ensureMonth(ymOf(ds));
    const due = expected(ds);
    if(due.length){
      const L = dayLog(ds);
      due.forEach(task=>{
        const e = L.e[task.id];
        if(!e || e.s==="open"){
          L.e[task.id] = { s:"miss", n:(e&&e.n)||"", f:(e&&e.f)||0, t:task.title, g:task.tag };
          n++;
        }
      });
      touched.add(ymOf(ds));
    }
    if(cur.getDay()===(WEEK_START+6)%7){ const k = await closeWeek(ds); if(k){ n += k; touched.add(ymOf(ds)); } }
    cur = shift(cur, 1);
  }
  touched.forEach(queueSaveMonth);
  state.settings.lastRun = t0;
  await saveSettings();
  return n;
}
/* at the end of each week, file any shortfall on weekly targets as misses on that Sunday */
async function closeWeek(sunday){
  const mon = keyOf(shift(parseKey(sunday), -6));
  await ensureMonth(ymOf(mon));
  let n = 0;
  state.tasks.filter(isWeekly).forEach(t=>{
    const q = weekQuota(t, mon); if(!q) return;
    const deficit = Math.max(0, q - weekCount(t, mon, sunday));
    if(!deficit) return;
    let fileOn = sunday;                                  // never file a shortfall on a rest day
    for(let i=0;i<7;i++){ const k = keyOf(shift(parseKey(sunday), -i)); if(!isRest(k)){ fileOn = k; break; } }
    const L = dayLog(fileOn);
    for(let k=1;k<=deficit;k++){
      const key = `${t.id}~w${k}`;
      if(!L.e[key]){ L.e[key] = { s:"miss", n:"", t:t.title, g:t.tag, w:1 }; n++; }
    }
    queueSaveMonth(ymOf(fileOn));
  });
  return n;
}
setInterval(async ()=>{
  if(state.dayKey !== today()){
    state.dayKey = today();
    const n = await rollover();
    go(state.tab);
    toast(n ? `New day — ${n} unchecked task${n===1?"":"s"} marked missed` : "New day, fresh list");
  }
}, 30000);

/* ============================ theme ============================ */
const mq = window.matchMedia("(prefers-color-scheme: dark)");
function applyTheme(animate){
  const t = state.settings.theme;
  const dark = t==="dark" || (t==="system" && mq.matches);
  const root = document.documentElement;
  if(animate && !reduced){ root.classList.add("theming"); setTimeout(()=>root.classList.remove("theming"), 500); }
  root.dataset.theme = dark ? "dark" : "light";
  root.style.setProperty("--accent", state.settings.accent);
  const icons = {
    system:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4"/><path d="M12 3.6a8.4 8.4 0 0 1 0 16.8z" fill="currentColor" stroke="none"/></svg>',
    light:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.2 4.2l1.5 1.5M18.3 18.3l1.5 1.5M2 12h2M20 12h2M4.2 19.8l1.5-1.5M18.3 5.7l1.5-1.5"/></svg>',
    dark:'<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'
  };
  $("#themeBtn").innerHTML = icons[t];
  if($("#themeBtn2")) $("#themeBtn2").innerHTML = icons[t];
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>{ m.setAttribute("content", dark ? "#0e1815" : "#f4f7f4"); m.removeAttribute("media"); });
  $("#themeBtn").title = `Theme: ${t} (T)`;
}
mq.addEventListener("change", ()=>{ if(state.settings.theme==="system") applyTheme(true); });
function accentHex(){ const a = state.settings.accent || "#34c27a"; return /^#[0-9a-f]{6}$/i.test(a) ? a : "#34c27a"; }
function hexA(hex, a){ const n = parseInt(hex.slice(1),16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }

/* ============================ chrome ============================ */
const TABS = [
  ["today","Today",'<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>'],
  ["month","Month",'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>'],
  ["library","Library",'<svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg>'],
  ["stats","Stats",'<svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>'],
  ["export","Export",'<svg viewBox="0 0 24 24"><path d="M12 3v12M8 11l4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>'],
  ["settings","Settings",'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>']
];
function paintRail(instant){
  $("#navs").innerHTML = TABS.map(([id,label,svg],i)=>
    `<button class="nav" data-tab="${id}" aria-current="${state.tab===id}">${svg}<span>${label}</span><kbd>${i+1}</kbd></button>`).join("");
  moveInd(instant);
}
function moveInd(instant){
  const b = $("#navs .nav[aria-current='true']"), ind = $("#ind");
  if(!b || !ind) return;
  if(instant) ind.style.transition = "none";
  ind.style.top = b.offsetTop + "px";
  ind.style.height = b.offsetHeight + "px";
  if(instant){ void ind.offsetWidth; ind.style.transition = ""; }
}
window.addEventListener("resize", ()=>moveInd(true));
$("#navs").addEventListener("click", e=>{ const b=e.target.closest(".nav"); if(b) go(b.dataset.tab); });

function toast(msg, actionText, actionFn){
  const t = $("#toast");
  t.classList.toggle("action", !!actionText);
  t.innerHTML = `${esc(msg)}${actionText ? `<button class="toast-act">${esc(actionText)}</button>` : ""}`;
  if(actionText && actionFn){
    const b = t.querySelector(".toast-act");
    if(b) b.onclick = ()=>{ actionFn(); t.classList.remove("on"); };
  }
  t.classList.remove("on"); void t.offsetWidth; t.classList.add("on");
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("on"), actionText ? 4200 : 2400);
}
function openDialog(html, wide){
  const d = $("#dialog");
  d.classList.toggle("wide", !!wide);
  d.innerHTML = html; d.classList.add("on"); $("#scrim").classList.add("on");
}
function closeDialog(){ $("#dialog").classList.remove("on"); $("#scrim").classList.remove("on"); }
$("#scrim").addEventListener("click", closeDialog);

/* renders a view; on tab entry, stagger the cards in and count numbers up */
const STAGGER = ".card,.row,.group-head,.section-label,.hrow";
function paint(html){
  const v = $("#view");
  v.classList.remove("anim");
  v.innerHTML = html;
  if(state.enter && !reduced){
    v.querySelectorAll(STAGGER).forEach((el,i)=>el.style.setProperty("--i", Math.min(i,18)));
    void v.offsetWidth;
    v.classList.add("anim");
    clearTimeout(paint._t); paint._t = setTimeout(()=>v.classList.remove("anim"), 1700);
    countUp(v);
  }
  state.enter = false;
}
function countUp(root){
  root.querySelectorAll("[data-count]").forEach(el=>{
    const target = parseFloat(el.dataset.count); if(isNaN(target)) return;
    const pre = el.dataset.prefix || "", suf = el.dataset.suffix || "";
    const t0 = performance.now(), dur = 900;
    const step = now=>{
      const p = Math.min(1, (now-t0)/dur), e = 1 - Math.pow(1-p, 3);
      el.textContent = pre + Math.round(target*e) + suf;
      if(p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

document.addEventListener("keydown", e=>{
  const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName||"");
  if(focusOpen()){
    if(e.key==="Escape"){ hideFocus(); return; }
    if(e.key===" " && !typing && (focus.mode==="work"||focus.mode==="break")){
      e.preventDefault(); focus.running ? focusPause() : focusStart(); return;
    }
    return;
  }
  if(e.key==="Escape"){ closeDialog(); return; }
  if(typing || e.metaKey || e.ctrlKey || e.altKey) return;
  const n = "123456".indexOf(e.key);
  if(n > -1){ go(TABS[n][0]); return; }
  if(e.key==="/" && state.tab==="today"){
    e.preventDefault(); setTimeout(()=>$("#taskSearch")?.focus(),0); return;
  }
  if(e.key.toLowerCase()==="a" && state.tab==="today"){
    e.preventDefault(); setTimeout(()=>$("#quickAdd")?.focus(),0); return;
  }
  if(e.key.toLowerCase()==="f" && state.tab==="today"){
    e.preventDefault(); focusNext(); return;
  }
  if(e.key.toLowerCase()==="n" && (state.tab==="today"||state.tab==="library")) newTaskDialog();
  if(e.key.toLowerCase()==="t") $("#themeBtn").click();
});

/* ============================ router ============================ */
const addBtn = `<button class="btn" id="addBtn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add task</button>`;
const focusNextBtn = `<button class="btn ghost" id="focusNextBtn">${TIMER}Focus next</button>`;
async function go(tab){
  state.tab = tab; state.enter = true;
  paintRail();
  $(".scroll").scrollTop = 0;
  const acts = $("#topActs");
  if(tab==="today") acts.innerHTML = `${focusNextBtn}${addBtn}`;
  else if(tab==="library") acts.innerHTML = addBtn;
  else if(tab==="stats") acts.innerHTML = `<div class="chips" id="rangeC">${[7,30,90].map(r=>`<button class="chip sm" data-r="${r}" aria-pressed="${state.range===r}">${r} days</button>`).join("")}</div>`;
  else if(tab==="month") acts.innerHTML = `<button class="btn ghost" id="shareTop">${SHARE}Share card</button>`;
  else acts.innerHTML = "";
  if($("#addBtn")) $("#addBtn").onclick = newTaskDialog;
  if($("#focusNextBtn")) $("#focusNextBtn").onclick = focusNext;
  if($("#shareTop")) $("#shareTop").onclick = ()=>shareDialog(`${state.cursor.getFullYear()}-${pad(state.cursor.getMonth()+1)}`);
  if($("#rangeC")) $("#rangeC").onclick = e=>{ const b=e.target.closest(".chip"); if(b){ state.range = +b.dataset.r; go("stats"); } };
  if(tab==="today")   await viewToday();
  if(tab==="month")   await viewMonth();
  if(tab==="library") viewLibrary();
  if(tab==="stats")   await viewStats();
  if(tab==="export")  await viewExport();
  if(tab==="settings") viewSettings();
}

/* ============================ Today ============================ */
async function viewToday(){
  const date = today(), yest = keyOf(shift(nowD(),-1));
  await ensureMonth(ymOf(date)); await ensureMonth(ymOf(yest)); await ensureMonth(ymOf(weekStart(date)));
  const L = dayLog(date);
  const exp = expected(date);
  const resting = isRest(date), rest = currentRest();
  const weekly = resting
    ? state.tasks.filter(t=>t.repeat!=="once" && activeOn(t, date))
    : weeklyActive(date).filter(t=>!exp.includes(t));
  const logged = t=>{ const s = statusOf(date,t.id); return s==="done" || s==="mini"; };
  const score = exp.reduce((a,t)=>a + (VAL[statusOf(date,t.id)] || 0), 0);
  const pct = exp.length ? Math.round(score/exp.length*100) : 0;
  const open = exp.filter(t=>!logged(t));
  const wOpen = weekly.filter(t=>!logged(t));
  const doneList = [...exp, ...weekly].filter(logged);
  const nDone = exp.filter(t=>statusOf(date,t.id)==="done").length;
  const nMini = exp.filter(t=>statusOf(date,t.id)==="mini").length;
  const fMin = focusMinutes(date);
  const yc = dayStat(yest);
  const R = 62, C = 2*Math.PI*R, from = state.lastPct ?? 0;

  $("#h-title").textContent = "Today";
  $("#h-sub").textContent = longDate(date);

  const rowOf = (t, status, meta) => rowHTML({
    id:t.id, title:t.title, tag:t.tag, status, task:t, live:true,
    note:(L.e[t.id]||{}).n, focusMin:(L.e[t.id]||{}).f || 0,
    meta: status==="done" ? "Completed" : status==="mini" ? `Mini${t.mini?` · ${t.mini}`:""}` : (meta || schedText(t) + (t.mini?` · mini: ${t.mini}`:""))
  });

  let openBlock;
  if(!open.length){
    openBlock = exp.length
      ? `<div class="card empty"><p>All clear 🌿</p><small>Everything due today is checked off.</small></div>`
      : (weekly.length ? "" : `<div class="card empty"><p>No tasks yet</p><small>Add one to start building the record.</small></div>`);
  }else if(state.settings.groupByTag!==false && open.length > 5){
    const order = tagList().map(t=>t.name), groups = {};
    open.forEach(t=>{ (groups[t.tag] = groups[t.tag] || []).push(t); });
    const names = Object.keys(groups).sort((a,b)=>{
      const ia = order.indexOf(a), ib = order.indexOf(b);
      return (ia<0?99:ia) - (ib<0?99:ib) || a.localeCompare(b);
    });
    openBlock = names.map(g=>{
      const all = exp.filter(t=>t.tag===g);
      const gd = all.filter(logged).length;
      return `<div class="group-head"><i class="dot" style="background:${tagColor(g)}"></i>${esc(g)}<span class="count">${gd}/${all.length}</span></div>
        ${groups[g].map(t=>rowOf(t,null)).join("")}`;
    }).join("");
  }else{
    openBlock = `<div class="section-label"><span>Open · ${open.length}</span><span>tick to complete</span></div>
      ${open.map(t=>rowOf(t,null)).join("")}`;
  }

  const mon = weekStart(date);
  const weeklyBlock = wOpen.length ? `
    <div class="section-label" style="margin-top:22px"><span>Flexible this week · ${wOpen.length}</span><span>counts toward a weekly target</span></div>
    ${wOpen.map(t=>{
      const q = weekQuota(t, mon), c = weekCount(t, mon, date);
      return rowOf(t, null, c>=q ? `${c}/${q} this week · target met ✓` : `${c}/${q} this week`);
    }).join("")}` : "";

  const matches = t => {
    const q = state.taskQuery.trim().toLowerCase();
    const tagOK = state.taskTag==="all" || t.tag===state.taskTag;
    const textOK = !q || [t.title,t.tag,t.mini||""].some(v=>String(v).toLowerCase().includes(q));
    return tagOK && textOK;
  };
  const vOpen = open.filter(matches);
  const vWeekly = wOpen.filter(matches);
  const vDone = doneList.filter(matches);
  const tagFilters = tagList().filter(t=>[...exp,...weekly,...doneList].some(x=>x.tag===t.name));

  const filteredOpenBlock = !vOpen.length
    ? (open.length ? `<div class="card empty quick-empty"><p>No matching tasks</p><small>Try another search or tag.</small></div>` : openBlock)
    : (state.settings.groupByTag!==false && vOpen.length > 5
      ? [...new Set(vOpen.map(t=>t.tag))].sort((a,b)=>a.localeCompare(b)).map(g=>{
          const all = exp.filter(t=>t.tag===g);
          const gd = all.filter(logged).length;
          return `<div class="group-head"><i class="dot" style="background:${tagColor(g)}"></i>${esc(g)}<span class="count">${gd}/${all.length}</span></div>
            ${vOpen.filter(t=>t.tag===g).map(t=>rowOf(t,null)).join("")}`;
        }).join("")
      : `<div class="section-label"><span>Open · ${vOpen.length}</span><span>tick to complete</span></div>
         ${vOpen.map(t=>rowOf(t,null)).join("")}`);

  const filteredWeeklyBlock = vWeekly.length ? `
    <div class="section-label" style="margin-top:22px"><span>${resting?"Optional today":"Flexible this week"} · ${vWeekly.length}</span><span>${resting?"rest day — nothing counts as missed":"counts toward a weekly target"}</span></div>
    ${vWeekly.map(t=>{
      if(resting) return rowOf(t, null, "Optional · rest day");
      const q = weekQuota(t, mon), c = weekCount(t, mon, date);
      return rowOf(t, null, c>=q ? `${c}/${q} this week · target met ✓` : `${c}/${q} this week`);
    }).join("")}` : "";

  const filteredDoneBlock = vDone.length ? `
    <div class="section-label" style="margin-top:22px"><span>Done today · ${vDone.length}</span></div>
    ${vDone.map(t=>rowOf(t, statusOf(date,t.id))).join("")}` : "";

  paint(`
  <div class="cols a">
    <div class="stack">
      ${resting ? `<div class="card rest-card"><div class="rest-row"><span class="em">🏖️</span>
        <div class="tx"><div style="font-size:14.5px;font-weight:600">Rest mode is on</div>
        <div class="sub">${rest && rest.to ? `Until ${prettyDate(rest.to)}` : "Until you end it"}. Streaks are paused and nothing counts as missed.</div></div>
        <button class="btn ghost tiny" id="endRestT">End rest</button></div></div>` : ""}
      <div class="card">
        <div class="ring-wrap">
          <div class="ring">
            <svg viewBox="0 0 142 142">
              <circle class="track" cx="71" cy="71" r="${R}"/>
              <circle class="bar" id="ringBar" cx="71" cy="71" r="${R}" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C - C*from/100).toFixed(2)}"/>
            </svg>
            <div class="mid">${resting && !exp.length ? `<b style="font-size:27px;letter-spacing:-.8px">Rest</b><small>day off</small>` : `<b>${pct}<span style="font-size:17px">%</span></b><small>${nDone+nMini} of ${exp.length}</small>`}</div>
          </div>
          <div class="facts">
            <div class="fact"><i class="dot" style="background:var(--accent)"></i><b>${nDone}</b> done${nMini?` · <b style="min-width:0">${nMini}</b> mini`:""}</div>
            <div class="fact"><i class="dot" style="background:var(--ink-3);opacity:.5"></i><b>${open.length}</b> still open</div>
            ${fMin?`<div class="fact"><i class="dot" style="background:#6aa8f0"></i><b>${fmtMin(fMin)}</b> focused</div>`:""}
            <div class="fact" style="font-size:12.5px;color:var(--ink-3);margin-top:2px">Anything left open at midnight is logged as missed.</div>
          </div>
        </div>
      </div>
      ${yc.total ? `
      <div class="card" style="padding:16px 22px">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
          <div><div style="font-size:13.5px;font-weight:500">Yesterday</div>
            <div class="sub">${yc.done+yc.mini} of ${yc.total} done${yc.mini?` (${yc.mini} mini)`:""}${yc.miss?` · ${yc.miss} missed`:""}</div></div>
          <button class="btn ghost tiny" id="seeYest">View</button>
        </div>
      </div>` : ""}
      ${state.settings.mood ? `
      <div class="card">
        <div class="card-head"><h2>How's the day going?</h2>${L.mood?`<span>${MOODS.find(m=>m[0]===L.mood)[1]} ${L.mood}</span>`:""}</div>
        <div class="moods">${MOODS.map(([id,em])=>`<button class="mood" data-mood="${id}" aria-pressed="${L.mood===id}">${em}<small>${id}</small></button>`).join("")}</div>
      </div>` : ""}
      <div class="card desk-only">
        <div class="card-head"><h2>How it works</h2></div>
        <p class="sub">Tick the box when you finish. Each task also has <b>½ Mini</b> (half credit, keeps the streak) and <b>Focus</b> (a timer that ticks it off). Tap or click a task name to edit it.<br><br>1–6 switch screens · A quick-adds · / searches · F focuses the next task · N opens the full task editor · T changes theme.</p>
      </div>
    </div>
    <div>
      <div class="quickbar">
        <div class="searchbox">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input id="taskSearch" type="text" placeholder="Find a task…" value="${esc(state.taskQuery)}" aria-label="Search today's tasks">
        </div>
        <div class="qadd">
          <input id="quickAdd" type="text" maxlength="60" placeholder="Quick add…">
          <button class="btn tiny" id="quickAddBtn">Add</button>
        </div>
        <span class="qhint">/ search · A add</span>
      </div>
      ${tagFilters.length ? `<div class="filterbar" id="taskFilters">
        <button class="chip sm" data-filter-tag="all" aria-pressed="${state.taskTag==="all"}">All</button>
        ${tagFilters.map(t=>`<button class="chip sm" data-filter-tag="${esc(t.name)}" aria-pressed="${state.taskTag===t.name}"><i style="background:${t.color}"></i>${esc(t.name)}</button>`).join("")}
      </div>` : ""}
      ${filteredOpenBlock}${filteredWeeklyBlock}${filteredDoneBlock}
    </div>
  </div>`);

  const bar = $("#ringBar");
  if(bar) requestAnimationFrame(()=>requestAnimationFrame(()=>{ bar.style.strokeDashoffset = (C - C*pct/100).toFixed(2); }));
  state.lastPct = pct;

  const view = $("#view");
  view.querySelectorAll("[data-check]").forEach(b=>b.addEventListener("click", e=>{
    e.stopPropagation();
    const task = findTask(b.dataset.check); if(!task) return;
    markTask(date, task, logged(task) ? null : "done", b);
  }));
  view.querySelectorAll("[data-mini]").forEach(b=>b.addEventListener("click", e=>{
    e.stopPropagation();
    const task = findTask(b.dataset.mini); if(task) markTask(date, task, "mini", b);
  }));
  view.querySelectorAll("[data-focus]").forEach(b=>b.addEventListener("click", e=>{
    e.stopPropagation();
    const task = findTask(b.dataset.focus); if(task) openFocus(task);
  }));
  view.querySelectorAll(".row.live .title").forEach(el=>el.addEventListener("click", ()=>{
    const task = findTask(el.closest(".row").dataset.row); if(task) taskDialog(task);
  }));
  view.querySelectorAll(".mood").forEach(b=>b.addEventListener("click",()=>{
    L.mood = (L.mood===b.dataset.mood) ? null : b.dataset.mood;
    queueSaveMonth(ymOf(date)); viewToday();
  }));
  const search = $("#taskSearch");
  if(search){
    search.addEventListener("input", e=>{ state.taskQuery = e.target.value; viewToday(); setTimeout(()=>{ const el=$("#taskSearch"); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); } },0); });
  }
  const qa = $("#quickAdd"), qab = $("#quickAddBtn");
  const doQuickAdd = async ()=>{
    const raw = qa?.value.trim() || "";
    if(!raw) return;
    const tagMatch = raw.match(/(?:^|\\s)#([a-zA-Z0-9_-]{1,18})$/);
    const typedTag = tagMatch ? tagMatch[1].toLowerCase() : "";
    const title = raw.replace(/\\s#[a-zA-Z0-9_-]{1,18}$/,"").trim();
    if(!title){ qa.focus(); return; }
    let tag = typedTag && tagList().some(t=>t.name===typedTag) ? typedTag : tagList()[0]?.name || "general";
    if(typedTag && !tagList().some(t=>t.name===typedTag)) toast(`Unknown tag #${typedTag} — used ${tag}`);
    const task = { id:uid(), title, tag, repeat:"daily", created:today() };
    state.tasks.push(task); await saveTasks(); qa.value=""; state.taskQuery=""; state.taskTag="all";
    toast(`Added "${title}"`); viewToday();
  };
  if(qab) qab.onclick = doQuickAdd;
  if(qa) qa.addEventListener("keydown", e=>{ if(e.key==="Enter") doQuickAdd(); });
  if($("#taskFilters")) $("#taskFilters").onclick = e=>{
    const b=e.target.closest("[data-filter-tag]"); if(!b) return;
    state.taskTag=b.dataset.filterTag; viewToday();
  };
  if($("#endRestT")) $("#endRestT").onclick = ()=>{ endRest(); viewToday(); };
  if($("#seeYest")) $("#seeYest").onclick = ()=>{ state.selDay = yest; state.cursor = parseKey(yest); go("month"); };
  return pct;
}

function focusNext(){
  if(state.tab!=="today"){ go("today"); return; }
  const date = today();
  const next = expected(date).find(t=>statusOf(date,t.id)!=="done" && statusOf(date,t.id)!=="mini")
    || weeklyActive(date).find(t=>statusOf(date,t.id)!=="done" && statusOf(date,t.id)!=="mini");
  if(next){ openFocus(next); }
  else toast("Nothing open — today's list is clear 🌿");
}

async function markTask(date, task, s, btn){
  const row = btn && btn.closest(".row");
  const before = state.lastPct ?? 0;
  if(row && !reduced){
    const ck = row.querySelector(".check"); if(ck) ck.classList.add("pop");
    row.classList.add(s ? "leaving" : "leaving-back");
    await wait(s ? 250 : 210);
  }
  setMark(date, task, s);
  state.justDone = s ? task.id : null;
  const pct = state.tab==="today" ? await viewToday() : before;
  state.justDone = null;
  if(before < 100 && pct === 100){ burst(); toast("Perfect day 🌿 everything's checked off"); }
  else if(s==="done") toast(`${task.title} — done ✓`);
  else if(s==="mini") toast(`${task.title} — mini logged, streak safe`);
}

function rowHTML({id,title,tag,status,note,meta,live,task,focusMin}){
  const cls = status==="done" ? "is-done" : status==="mini" ? "is-mini" : status==="miss" ? "is-miss" : "";
  const st = status || "none";
  const aria = status==="done" ? "true" : status==="mini" ? "mixed" : "false";
  const box = live
    ? `<button class="check" data-check="${id}" data-state="${st}" role="checkbox" aria-checked="${aria}" title="${status?"Undo":"Mark done"}">${CHECK}</button>`
    : `<span class="check ro" data-state="${st}" role="img" aria-label="${status||"not logged"}">${CHECK}</span>`;
  const line = (meta || (status==="done"?"Completed":status==="mini"?"Mini":status==="miss"?"Missed":"Not logged"))
             + (focusMin ? ` · ⏱ ${fmtMin(focusMin)}` : "") + (note ? ` · ${note}` : "");
  const tools = (live && !status && task) ? `<div class="tools">
      ${task.mini ? `<button class="tbtn" data-mini="${id}" title="Log the mini version — half credit, keeps the streak">½ Mini</button>` : ""}
      <button class="tbtn" data-focus="${id}" title="Start a focus timer">${TIMER}Focus</button>
    </div>` : "";
  const arrive = live && state.justDone===id ? "arrive" : "";
  return `<div class="row ${cls} ${live?"live":""} ${arrive}" data-row="${id}">
    ${box}<div class="title">${esc(title)}<span>${esc(line)}</span></div>${tools}${tagPill(tag)}
  </div>`;
}

function taskDialog(existing){
  const edit = !!existing, tags = tagList();
  const onceEdit = edit && existing.repeat==="once";
  let tag = edit ? existing.tag : tags[0].name;
  let mode = !edit ? "daily" : onceEdit ? "once" : (existing.sched && existing.sched.type) || "daily";
  let days = edit && existing.sched && existing.sched.type==="days" ? [...existing.sched.days] : [1,2,3,4,5];
  let perWeek = edit && existing.sched && existing.sched.type==="weekly" ? existing.sched.n : 3;
  const modes = [["daily","Every day"],["days","Pick days"],["weekly","Times a week"]].concat(edit ? [] : [["once","Just once"]]);

  openDialog(`
    <h3>${edit?"Edit task":"New task"}</h3>
    <p class="sub">${edit?"History already logged keeps its old name and schedule.":"Recurring tasks come back on their days — whatever happened before."}</p>
    <div class="fld-wrap">
      <label class="fld" for="tt">What is it?</label>
      <input type="text" id="tt" maxlength="60" placeholder="Read for 30 minutes" autocomplete="off" value="${edit?esc(existing.title):""}">
    </div>
    <div class="fld-wrap">
      <label class="fld">Tag</label>
      <div class="chips" id="tagChips">${tags.map(t=>`<button class="chip" data-tag="${esc(t.name)}" aria-pressed="${t.name===tag}"><i style="background:${t.color}"></i>${esc(t.name)}</button>`).join("")}</div>
    </div>
    ${onceEdit ? "" : `
    <div class="fld-wrap">
      <label class="fld">How often</label>
      <div class="chips" id="modeC">${modes.map(([k,l])=>`<button class="chip" data-mode="${k}" aria-pressed="${mode===k}">${l}</button>`).join("")}</div>
      <div id="modeDetail" style="margin-top:10px"></div>
    </div>
    <div class="fld-wrap" id="miniWrap">
      <label class="fld" for="mv">Mini version <span style="color:var(--ink-3)">— optional · half credit, keeps the streak</span></label>
      <input type="text" id="mv" maxlength="50" placeholder="e.g. read just 1 page" autocomplete="off" value="${edit?esc(existing.mini||""):""}">
    </div>`}
    <div class="row2">
      <button class="btn wide" id="saveTask">${edit?"Save":"Add task"}</button>
      <button class="btn ghost wide" id="cancelTask">Cancel</button>
    </div>`);

function dayPanelHTML(date){
  const L = state.logs[date] || { mood:null, e:{} };
  const seen = new Set(), rows = [];
  if(date >= today()) expected(date).forEach(t=>{

    rows.push({ id:t.id, title:t.title, tag:t.tag, status:statusOf(date,t.id), note:(L.e[t.id]||{}).n, focusMin:(L.e[t.id]||{}).f||0 });
  });
  for(const id in (L.e||{})){
    if(seen.has(id)) continue;
    const e = L.e[id], s = statusOf(date, id); if(!s) continue;
    rows.push({ id, title:e.t||"Removed task", tag:e.g||"—", status:s, note:e.n, focusMin:e.f||0,

}
