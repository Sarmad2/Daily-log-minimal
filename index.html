/* ============================ Stats maths ============================ */
function rangeKeys(n){ const now = nowD(), out = []; for(let i=n-1;i>=0;i--) out.push(keyOf(shift(now,-i))); return out; }
function rollup(keys){
  let done=0, mini=0, miss=0, days=0, perfect=0;
  keys.forEach(ds=>{
    const c = dayStat(ds); if(!c.total) return;
    days++; done+=c.done; mini+=c.mini; miss+=c.miss;
    if(c.miss===0 && c.open===0) perfect++;
  });
  const settled = done+mini+miss;
  return { done, mini, miss, days, perfect, rate: settled ? Math.round((done + mini*.5)/settled*100) : null };
}
function earliestCreated(){ return state.tasks.reduce((m,t)=>(!m || t.created<m) ? t.created : m, null); }
/* day-based streak: consecutive recorded completions (done or mini). Days with no record are skipped. */
function taskStreak(task){
  if(isWeekly(task)) return weekStreaks(task).cur;
  const now = nowD(); let streak = 0;
  for(let i=0;i<400;i++){
    const ds = keyOf(shift(now,-i));
    if(ds < task.created || !state.loaded.has(ymOf(ds))) break;
    const s = statusOf(ds, task.id);
    if(s==="done" || s==="mini"){ streak++; continue; }
    if(!s || i===0) continue;
    break;
  }
  return streak;
}
function taskBest(task){
  if(isWeekly(task)) return weekStreaks(task).best;
  const now = nowD(); let best = 0, run = 0;
  for(let i=399;i>=0;i--){
    const ds = keyOf(shift(now,-i));
    if(ds < task.created || !state.loaded.has(ymOf(ds))) continue;
    const s = statusOf(ds, task.id);
    if(s==="done" || s==="mini"){ run++; best = Math.max(best, run); }
    else if(s==="miss") run = 0;
  }
  return best;
}
/* weekly habits: streak counted in weeks where the target was met */
function weekStreaks(t){
  const mon0 = weekStart(today()), weeks = [];
  for(let w=0; w<60; w++){
    const mon = keyOf(shift(parseKey(mon0), -7*w)), sun = keyOf(shift(parseKey(mon), 6));
    if(sun < t.created || !state.loaded.has(ymOf(sun))) break;
    const q = weekQuota(t, mon); if(!q){ weeks.push(null); continue; }
    if(w===0){ weeks.push(weekCount(t, mon, today()) >= q ? true : null); continue; }
    let short = false;
    for(let i=0;i<7 && !short;i++){
      const L = state.logs[keyOf(shift(parseKey(mon), i))];
      short = !!(L && L.e && Object.keys(L.e).some(k=>k.startsWith(t.id+"~w")));
    }
    weeks.push(!short);
  }
  let cur = 0, best = 0, run = 0;
  for(const m of weeks){ if(m===null) continue; if(m) cur++; else break; }
  for(const m of weeks.slice().reverse()){ if(m===true){ run++; best = Math.max(best, run); } else if(m===false) run = 0; }
  return { cur, best };
}
function perfectStreak(){
  const now = nowD(), first = earliestCreated(); let streak = 0;
  for(let i=0;i<400;i++){
    const ds = keyOf(shift(now,-i));
    if((first && ds < first) || !state.loaded.has(ymOf(ds))) break;
    const c = dayStat(ds);
    if(!c.total) continue;
    if(c.miss===0 && c.open===0){ streak++; continue; }
    if(i===0) continue;
    break;
  }
  return streak;
}
function moodInsights(keys, rows){
  const moodDays = keys.filter(ds=>state.logs[ds] && state.logs[ds].mood);
  const levels = MOODS.map(([id,em])=>{
    let sc = 0, n = 0;
    moodDays.filter(d=>state.logs[d].mood===id).forEach(d=>{
      const c = dayStat(d), set = c.done+c.mini+c.miss;
      if(set){ sc += (c.done + c.mini*.5)/set; n++; }
    });
    return { id, em, n, rate: n ? Math.round(sc/n*100) : null };
  });
  const avg = a => a.reduce((x,y)=>x+y,0)/a.length;
  const links = rows.map(r=>{
    const withIt = [], without = [];
    moodDays.forEach(d=>{
      const st = taskStatuses(d, r.t.id); if(!st.length) return;
      const mv = MOOD_VAL[state.logs[d].mood];
      if(st.some(s=>s==="done"||s==="mini")) withIt.push(mv); else without.push(mv);
    });
    if(withIt.length < 3 || without.length < 3) return null;
    const a = avg(withIt), b = avg(without);
    return { t:r.t, a, b, diff:a-b };
  }).filter(Boolean).sort((x,y)=>Math.abs(y.diff)-Math.abs(x.diff)).slice(0,5);
  return { levels, links, count:moodDays.length };
}

/* 7-day rolling completion rate as an animated line + area */
function trendSVG(series, keys, avg){
  const W=720, H=210, L=34, Rg=10, T=14, B=24, iw=W-L-Rg, ih=H-T-B;
  const xAt = i => L + (series.length<2 ? iw/2 : (i/(series.length-1))*iw);
  const yAt = v => T + (1 - v/100)*ih;
  const pts = [];
  series.forEach((v,i)=>{ if(v!==null) pts.push([xAt(i), yAt(v), i, v]); });
  if(pts.length < 2) return `<p class="sub">Not enough closed days yet to draw a trend — this fills in as days finish.</p>`;
  const line = pts.map((p,i)=>`${i?"L":"M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
  const base = (T+ih).toFixed(1);
  const area = `${line} L${pts[pts.length-1][0].toFixed(1)},${base} L${pts[0][0].toFixed(1)},${base} Z`;
  const grid = [0,25,50,75,100].map(v=>`<line class="gl" x1="${L}" x2="${W-Rg}" y1="${yAt(v).toFixed(1)}" y2="${yAt(v).toFixed(1)}"/>
     <text class="tx" x="${L-7}" y="${(yAt(v)+3.5).toFixed(1)}" text-anchor="end">${v}</text>`).join("");
  const avgLine = avg===null ? "" : `<line class="avg" x1="${L}" x2="${W-Rg}" y1="${yAt(avg).toFixed(1)}" y2="${yAt(avg).toFixed(1)}"/>
     <text class="tx" x="${W-Rg}" y="${(yAt(avg)-6).toFixed(1)}" text-anchor="end">${avg}% average</text>`;
  const hot = pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="9" fill="transparent"><title>${prettyDate(keys[p[2]])} — ${p[3]}%</title></circle>`).join("");
  const last = pts[pts.length-1];
  return `<svg class="trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="Seven-day rolling completion rate">
    <defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent)" stop-opacity=".34"/><stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}
    <path class="ar" d="${area}" fill="url(#tg)"/>
    <path class="ln" d="${line}" pathLength="1"/>
    ${avgLine}
    <circle class="pulse" cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4.5"/>
    <circle class="pt" cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4.5"/>
    ${hot}
    <text class="tx" x="${L}" y="${H-6}">${prettyDate(keys[pts[0][2]])}</text>
    <text class="tx" x="${W-Rg}" y="${H-6}" text-anchor="end">today</text>
  </svg>`;
}

/* ============================ Stats view ============================ */
async function viewStats(){
  const now = nowD();
  const monthsBack = Math.min(9, Math.ceil((state.range*2)/30) + 2);
  for(let i=0;i<monthsBack;i++){ const d = new Date(now.getFullYear(), now.getMonth()-i, 1); await ensureMonth(`${d.getFullYear()}-${pad(d.getMonth()+1)}`); }
  const N = state.range;
  $("#h-title").textContent = "Stats";
  $("#h-sub").textContent = `Last ${N} days`;
  const keys = rangeKeys(N), cur = rollup(keys);
  const prevKeys = []; for(let i=N*2-1;i>=N;i--) prevKeys.push(keyOf(shift(now,-i)));
  const prev = rollup(prevKeys);
  if(!cur.days){
    paint(`<div class="card empty"><p>No history in this window yet</p><small>Tick a few boxes on Today — the numbers fill in as days close.</small></div>`);
    return;
  }

  const active = state.tasks.filter(t=>!t.removed && t.repeat!=="once");
  const rows = active.map(t=>{
    let d=0, mi=0, m=0, f=0;
    keys.forEach(ds=>{ taskStatuses(ds,t.id).forEach(s=>{ if(s==="done") d++; else if(s==="mini") mi++; else m++; }); f += focusMinutes(ds, t.id); });
    const set = d+mi+m;
    return { t, d, mi, m, f, rate: set ? Math.round((d + mi*.5)/set*100) : null,
             streak: taskStreak(t), best: taskBest(t), unit: isWeekly(t) ? "w" : "d" };
  }).sort((a,b)=>(b.rate??-1)-(a.rate??-1));

  const rated = rows.filter(r=>r.rate!==null);
  const consistency = rated.length ? Math.round(rated.reduce((a,r)=>a+r.rate,0)/rated.length) : null;
  const kept = rated.filter(r=>r.rate>=70).length;
  const last7 = rollup(keys.slice(-7));
  const momentum = (last7.rate!==null && cur.rate!==null) ? last7.rate - cur.rate : null;
  const delta = (cur.rate!==null && prev.rate!==null) ? cur.rate - prev.rate : null;
  const focusTotal = keys.reduce((a,ds)=>a+focusMinutes(ds),0);

  const stats = keys.map(ds=>dayStat(ds));
  const series = stats.map((_,idx)=>{
    let sc=0, set=0;
    for(let k=Math.max(0,idx-6); k<=idx; k++){ const c = stats[k]; sc += c.done + c.mini*.5; set += c.done+c.mini+c.miss; }
    return set ? Math.round(sc/set*100) : null;
  });

  const chartKeys = keys.slice(-Math.min(N,30));
  const peak = Math.max(1, ...chartKeys.map(ds=>{ const c = dayStat(ds); return c.done+c.mini+c.miss; }));
  const chart = chartKeys.map((ds,j)=>{
    const c = dayStat(ds);
    if(!c.total) return `<div class="col" style="--j:${j}"><i class="z"></i><span class="tip">${prettyDate(ds)} · nothing recorded</span></div>`;
    const h = v => Math.round(v/peak*100);
    return `<div class="col" style="--j:${j}">
      <span class="tip">${prettyDate(ds)} · ${c.done} done${c.mini?` · ${c.mini} mini`:""}${c.miss?` · ${c.miss} missed`:""}${c.open?` · ${c.open} open`:""}</span>
      ${c.miss?`<i class="m" style="height:${h(c.miss)}%"></i>`:""}
      ${c.mini?`<i class="h" style="height:${h(c.mini)}%"></i>`:""}

function saveBlob(blob, name){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function csvCell(v){ const s = String(v??""); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; }
async function downloadMonth(ym){
  await ensureMonth(ym);
  const dates = Object.keys(state.logs).filter(d=>d.startsWith(ym)).sort();
  const rows = [["Date","Task","Tag","Status","Focus (min)","Note"]];
  let done=0, mini=0, miss=0, focusT=0; const tally = {};
  dates.forEach(d=>{
    const L = state.logs[d];
    Object.keys(L.e||{}).forEach(id=>{
      const e = L.e[id];
      const label = e.s==="done" ? "Completed" : e.s==="mini" ? "Mini" : e.s==="open" ? "Open" : (e.w ? "Missed (weekly target)" : "Missed");
      rows.push([d, e.t||"", e.g||"", label, e.f||"", e.n||""]);
      focusT += e.f || 0;
      if(e.s==="done"){ done++; tally[e.g||"—"]=(tally[e.g||"—"]||0)+1; }
      else if(e.s==="mini"){ mini++; tally[e.g||"—"]=(tally[e.g||"—"]||0)+1; }
      else if(e.s!=="open") miss++;
    });
    if(L.mood) rows.push([d,"Mood check-in","mood",L.mood,"",""]);
  });
  const [y,m] = ym.split("-");
  const top = Object.entries(tally).sort((a,b)=>b[1]-a[1])[0];
  const set = done+mini+miss;
  rows.push([], ["Summary", `${MONTHS[+m-1]} ${y}`], ["Days logged", dates.length], ["Completed", done], ["Mini", mini], ["Missed", miss],
    ["Completion rate", set ? `${Math.round((done+mini*.5)/set*100)}%` : "—"], ["Focus minutes", focusT], ["Busiest tag", top ? `${top[0]} (${top[1]})` : "—"]);
  saveBlob(new Blob([rows.map(r=>r.map(csvCell).join(",")).join("\n")], { type:"text/csv;charset=utf-8" }), `daily-log-${ym}.csv`);
  toast(dates.length ? "CSV downloaded" : "Empty month exported");
}
async function downloadBackup(){
  for(const k of await S.keys("dl:log:")) await ensureMonth(k.replace("dl:log:",""));
  const data = { app:"daily-log", version:2, exported:new Date().toISOString(), settings:state.settings, tasks:state.tasks, logs:state.logs };
  saveBlob(new Blob([JSON.stringify(data,null,2)], { type:"application/json" }), `daily-log-backup-${today()}.json`);
  toast("Backup downloaded");
}
async function restoreBackup(file){
  let data;
  try{ data = JSON.parse(await file.text()); }catch(e){ toast("That file isn't readable JSON"); return; }
  if(data.app !== "daily-log" || !Array.isArray(data.tasks)){ toast("Not a Daily Log backup"); return; }
  const dayN = Object.keys(data.logs||{}).length;
  openDialog(`
    <h3>Restore this backup?</h3>
    <p class="sub">${data.tasks.length} task${data.tasks.length===1?"":"s"} and ${dayN} logged day${dayN===1?"":"s"} from ${esc((data.exported||"").slice(0,10))}. Everything currently stored here is replaced.</p>
    <div class="row2"><button class="btn wide" id="yes">Restore</button><button class="btn ghost wide" id="no">Cancel</button></div>`);
  $("#no").onclick = closeDialog;
  $("#yes").onclick = async ()=>{
    for(const k of await S.keys("dl:log:")) await S.del(k);
    state.tasks = data.tasks;
    if(data.settings){ Object.assign(state.settings, data.settings); syncPrefs(); }
    state.logs = data.logs || {}; state.loaded.clear();
    const buckets = {};
    for(const d in state.logs){ (buckets[ymOf(d)] = buckets[ymOf(d)] || {})[d] = state.logs[d]; }
    for(const ym in buckets){ await S.set(K.log(ym), buckets[ym]); state.loaded.add(ym); }
    await saveTasks(); await saveSettings();
    closeDialog(); applyTheme(true); toast("Backup restored"); go("today");
  };
}

function monthSummary(ym){
  const [y,m] = ym.split("-").map(Number);
  const nDays = new Date(y,m,0).getDate(), t0 = today(), keys = [], cells = [];
  for(let d=1; d<=nDays; d++){
    const ds = `${ym}-${pad(d)}`;
    if(ds > t0){ cells.push({ d, ds, ratio:null, future:true }); continue; }
    keys.push(ds);
    const c = dayStat(ds);
    cells.push({ d, ds, ratio: c.total ? c.score/c.total : null, future:false });
  }
  const r = rollup(keys);
  const hab = state.tasks.filter(t=>t.repeat!=="once").map(t=>{
    let sc = 0, n = 0;
    keys.forEach(ds=>taskStatuses(ds,t.id).forEach(s=>{ sc += VAL[s]; n++; }));
    return { t, n, rate: n ? Math.round(sc/n*100) : null };
  }).filter(h=>h.n>0);
  const consistency = hab.length ? Math.round(hab.reduce((a,h)=>a+h.rate,0)/hab.length) : null;
  const best = hab.filter(h=>h.n>=5).sort((a,b)=>b.rate-a.rate)[0] || hab.sort((a,b)=>b.rate-a.rate)[0] || null;
  let run = 0, bestRun = 0;
  keys.forEach(ds=>{
    const c = dayStat(ds); if(!c.total) return;
    if(c.miss===0 && c.open===0){ run++; bestRun = Math.max(bestRun, run); } else run = 0;
  });
  const focusT = keys.reduce((a,ds)=>a+focusMinutes(ds),0);
  const moods = keys.map(ds=>state.logs[ds] && state.logs[ds].mood).filter(Boolean).map(x=>MOOD_VAL[x]);
  const moodAvg = moods.length ? moods.reduce((a,b)=>a+b,0)/moods.length : null;
  return { y, m, nDays, firstDow:(new Date(y,m-1,1).getDay()-WEEK_START+7)%7, cells, rate:r.rate, done:r.done+r.mini, miss:r.miss,
           perfect:r.perfect, days:r.days, consistency, best, bestRun, focus:focusT, moodAvg,
           moodEmoji: moodAvg ? MOODS[Math.min(4,Math.max(0,Math.round(moodAvg)-1))][1] : null };
}
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function glassPanel(ctx,x,y,w,h,r){
  ctx.save();
  rr(ctx,x,y,w,h,r); ctx.fillStyle = "rgba(255,255,255,.055)"; ctx.fill();
  const g = ctx.createLinearGradient(0,y,0,y+h*.6); g.addColorStop(0,"rgba(255,255,255,.07)"); g.addColorStop(1,"rgba(255,255,255,0)");
  rr(ctx,x,y,w,h,r); ctx.fillStyle = g; ctx.fill();
  rr(ctx,x+1,y+1,w-2,h-2,r-1); ctx.strokeStyle = "rgba(255,255,255,.11)"; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}
function glowBlob(ctx,x,y,r,hex,a){
  const g = ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0, hexA(hex,a)); g.addColorStop(1, hexA(hex,0));
  ctx.fillStyle = g; ctx.fillRect(x-r,y-r,r*2,r*2);
}
function fitText(ctx, text, max){
  if(ctx.measureText(text).width <= max) return text;
  let t = text; while(t.length > 1 && ctx.measureText(t+"…").width > max) t = t.slice(0,-1);
  return t + "…";
}

  const mName = MONTHS[s.m-1]; ctx.fillText(mName, 80, 200);
  const mw = ctx.measureText(mName).width;
  ctx.fillStyle = INK3; ctx.font = F(300,86); ctx.fillText(` ${s.y}`, 80+mw, 200);

  glassPanel(ctx,80,250,920,310,44);
  const big = s.consistency===null ? "—" : String(s.consistency);

/* ============================ Focus timer ============================ */
const FS = () => Object.assign({ preset:25, breakMin:5, sound:true, autoDone:true }, state.settings.focus || {});
const focus = { task:null, total:25*60, remaining:25*60, endAt:0, running:false, mode:"work", preset:25, autoDone:true, iv:null };
const FC = 2*Math.PI*128;
const fmtClock = s => `${pad(Math.floor(Math.max(0,s)/60))}:${pad(Math.max(0,s)%60)}`;
const focusOpen = () => $("#focus").classList.contains("on");
const sessionLive = () => !!focus.task && (focus.running || ((focus.mode==="work"||focus.mode==="break") && focus.remaining < focus.total));
function openFocus(task){
  if(sessionLive() && focus.task.id !== task.id){ toast("A session is already running"); showFocus(); return; }
  if(!focus.task || focus.task.id !== task.id || focus.mode==="doneWork" || focus.mode==="doneBreak"){
    focus.task = task; focus.mode = "work"; focus.total = focus.preset*60; focus.remaining = focus.total; focus.running = false;
  }
  showFocus();
}
function showFocus(){ if(!focus.task) return; renderFocus(); $("#focus").classList.add("on"); $("#focus").setAttribute("aria-hidden","false"); updatePill(); }
function hideFocus(){ $("#focus").classList.remove("on"); $("#focus").setAttribute("aria-hidden","true"); updatePill(); }
function updatePill(){
  const p = $("#focusPill");
  if(focus.task && sessionLive() && !focusOpen()){
    p.hidden = false;
    p.innerHTML = `<span class="pdot ${focus.running?"live":""}"></span><b>${fmtClock(focus.remaining)}</b><span>${esc(focus.mode==="break"?"Break":focus.task.title)}</span>`;
  }else p.hidden = true;
  document.title = focus.running ? `${fmtClock(focus.remaining)} · ${focus.mode==="break"?"Break":focus.task.title}` : "Daily Log";
}
$("#focusPill").addEventListener("click", showFocus);
function renderFocus(){
  const f = focus, t = f.task; if(!t) return;
  const isBreak = f.mode==="break" || f.mode==="doneBreak";
  const phase = f.mode==="doneWork" ? "Session complete 🎉" : f.mode==="doneBreak" ? "Break's over"
              : f.running ? (isBreak ? "Breathe…" : "Focusing") : (f.remaining < f.total ? "Paused" : "Ready when you are");
  let ctl;
  if(f.mode==="doneWork") ctl = `<button class="btn" id="fBreak">Take a ${FS().breakMin}-min break</button><button class="btn ghost" id="fAgain">Another round</button><button class="btn ghost" id="fClose">Close</button>`;
  else if(f.mode==="doneBreak") ctl = `<button class="btn" id="fAgain">Start another session</button><button class="btn ghost" id="fClose">Close</button>`;
  else if(f.running) ctl = `<button class="btn" id="fPause">Pause</button><button class="btn ghost" id="fStop">${isBreak?"Skip break":"Stop & save"}</button>`;
  else if(f.remaining < f.total) ctl = `<button class="btn" id="fStart">Resume</button><button class="btn ghost" id="fStop">${isBreak?"Skip break":"Stop & save"}</button>`;
  else ctl = `<button class="btn" id="fStart">Start focus</button><button class="btn ghost" id="fClose">Close</button>`;
  const canPreset = !f.running && f.remaining===f.total && f.mode==="work";
  const tm = focusMinutes(today(), t.id);
  $("#focus").innerHTML = `
  <div class="panel ${f.running?"running":""} ${isBreak?"brk":""}">
    <div class="fhead"><span class="fkind">${isBreak?"Short break":"Focus session"}</span>
      <button class="icon-btn sm" id="fMin" title="Minimise (Esc)"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button></div>
    <h2 class="ftitle">${esc(t.title)}</h2>
    <div>${tagPill(t.tag)}</div>
    <div class="fring">
      <div class="glow"></div>
      <svg viewBox="0 0 280 280"><circle class="track" cx="140" cy="140" r="128"/>
        <circle class="bar" id="fBar" cx="140" cy="140" r="128" stroke-dasharray="${FC.toFixed(2)}" stroke-dashoffset="${(FC*f.remaining/f.total).toFixed(2)}"/></svg>
      <div class="mid"><div class="time" id="fTime">${fmtClock(f.remaining)}</div><div class="state">${phase}</div></div>
    </div>
    ${canPreset ? `<div class="chips fpresets" id="fPre">${[15,25,45,60].map(m=>`<button class="chip sm" data-m="${m}" aria-pressed="${f.preset===m}">${m} min</button>`).join("")}</div>` : ""}
    <div class="fctl">${ctl}</div>
    ${isBreak ? "" : `<div class="fauto" id="fAutoWrap"><button class="toggle" id="fAuto" aria-pressed="${f.autoDone}"><i></i></button>Tick the task off when the timer ends</div>`}
    <p class="sub fmeta">${tm?`${fmtMin(tm)} focused on this today · `:""}Space to start or pause · Esc to minimise</p>
  </div>`;
  const on = (id, fn) => { const el = $(id); if(el) el.onclick = fn; };
  on("#fMin", hideFocus); on("#fStart", focusStart); on("#fPause", focusPause); on("#fStop", focusStop);
  on("#fClose", focusClose); on("#fBreak", startBreak); on("#fAgain", focusAgain);
  on("#fAutoWrap", ()=>{
    focus.autoDone = !focus.autoDone; $("#fAuto").setAttribute("aria-pressed", focus.autoDone);
    state.settings.focus = { ...FS(), autoDone:focus.autoDone }; saveSettings();
  });
  if($("#fPre")) $("#fPre").onclick = e=>{
    const b = e.target.closest(".chip"); if(!b) return;
    focus.preset = +b.dataset.m; focus.total = focus.preset*60; focus.remaining = focus.total; renderFocus();
  };
}
function requestNotify(){ try{ if("Notification" in window && Notification.permission==="default") Notification.requestPermission(); }catch(e){} }
function notify(title, body){ try{ if("Notification" in window && Notification.permission==="granted" && document.hidden) new Notification(title, { body }); }catch(e){} }
function focusStart(){
  if(focus.running) return;
  requestNotify();
  focus.endAt = Date.now() + focus.remaining*1000; focus.running = true;
  clearInterval(focus.iv); focus.iv = setInterval(focusTick, 250);
  renderFocus(); updatePill();
}
function focusPause(){
  if(!focus.running) return;
  focus.remaining = Math.max(0, Math.ceil((focus.endAt - Date.now())/1000));
  focus.running = false; clearInterval(focus.iv);
  renderFocus(); updatePill();
}
function focusTick(){
  focus.remaining = Math.max(0, Math.ceil((focus.endAt - Date.now())/1000));
  const tm = $("#fTime"), bar = $("#fBar");
  if(tm) tm.textContent = fmtClock(focus.remaining);
  if(bar) bar.setAttribute("stroke-dashoffset", (FC*focus.remaining/focus.total).toFixed(2));
  updatePill();
  if(focus.remaining <= 0) focusFinish();
}
function logFocus(t, mins){
  const d = today(), L = dayLog(d), e = L.e[t.id];
  if(e) e.f = (e.f || 0) + mins;
  else L.e[t.id] = { s:"open", n:"", f:mins, t:t.title, g:t.tag };
  queueSaveMonth(ymOf(d));
}
function focusFinish(){
  clearInterval(focus.iv); focus.running = false; focus.remaining = 0;
  chime();
  const t = focus.task;
  if(focus.mode==="work"){
    const mins = Math.round(focus.total/60);
    logFocus(t, mins);
    if(focus.autoDone && statusOf(today(), t.id)!=="done") setMark(today(), t, "done");
    notify(`${t.title} — ${mins} min focused`, focus.autoDone ? "Ticked off. Take a short break?" : "Take a short break?");
    focus.mode = "doneWork"; burst(); toast(`${mins} min focused on ${t.title}`);
  }else{
    notify("Break's over", "Ready for the next session?");
    focus.mode = "doneBreak";
  }
  renderFocus(); updatePill();
  if(state.tab==="today") viewToday();
}
function focusStop(){
  const left = focus.running ? Math.max(0, Math.ceil((focus.endAt - Date.now())/1000)) : focus.remaining;
  const elapsed = focus.total - left;
  clearInterval(focus.iv); focus.running = false;
  if(focus.mode==="work"){
    if(elapsed >= 60){ const m = Math.floor(elapsed/60); logFocus(focus.task, m); toast(`Saved ${m} min of focus`); if(state.tab==="today") viewToday(); }
    focus.remaining = focus.total;
  }else{ focus.mode = "doneBreak"; focus.remaining = 0; }
  renderFocus(); updatePill();
}
function focusClose(){
  clearInterval(focus.iv); focus.running = false; focus.task = null; focus.mode = "work";
  focus.total = focus.preset*60; focus.remaining = focus.total; hideFocus();
}
function startBreak(){ focus.mode = "break"; focus.total = FS().breakMin*60; focus.remaining = focus.total; focusStart(); }
function focusAgain(){ focus.mode = "work"; focus.total = focus.preset*60; focus.remaining = focus.total; renderFocus(); updatePill(); }
function chime(){
  if(!FS().sound) return;
  try{
    const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    const ctx = new AC();
    [[660,0],[880,.16],[1320,.32]].forEach(([fq,t])=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = fq;
      g.gain.setValueAtTime(.0001, ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.16, ctx.currentTime+t+.02);
      g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime+t+.6);
      o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+.65);
    });
    setTimeout(()=>ctx.close && ctx.close(), 1600);
  }catch(e){}
}

function burst(){
  if(reduced) return;
  const cv = $("#confetti"); let ctx = null;
  try{ ctx = cv.getContext("2d"); }catch(e){}
  if(!ctx) return;
  const dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const cols = [accentHex(), ...tagList().map(t=>t.color).slice(0,5), "#ffffff"];
  const P = Array.from({length:140}, ()=>({
    x: W*.6 + (Math.random()-.5)*160, y: H*.34, vx:(Math.random()-.5)*15, vy:-Math.random()*14-4,
    r: Math.random()*Math.PI, vr:(Math.random()-.5)*.32, w:5+Math.random()*6, h:8+Math.random()*9,
    c: cols[(Math.random()*cols.length)|0]
  }));
  let f = 0;
  const step = ()=>{
    ctx.clearRect(0,0,W,H);
    P.forEach(p=>{
      p.vy += .38; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.max(0, 1 - f/130);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    });
    if(++f < 135) requestAnimationFrame(step); else ctx.clearRect(0,0,W,H);
  };
  requestAnimationFrame(step);
}

      <div class="card desk-only">
        <div class="card-head"><h2>Keyboard</h2></div>
        <div class="keys-list">${keys.map(([k,d])=>`<kbd>${k}</kbd><span>${d}</span>`).join("")}</div>
      </div>
    </div>
  </div>`);

  const pick = (id, fn) => $("#"+id).addEventListener("click", e=>{
    const b = e.target.closest(".chip"); if(!b) return;
    $("#"+id).querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed", c===b));
    fn(b.dataset.v);
  });
  pick("dayEndC", v=>{ s.dayEnd = +v; syncPrefs(); saveSettings(); toast(+v ? `Your day now ends at ${v} am 🌙` : "Your day ends at midnight"); });
  pick("weekC", v=>{ s.weekStart = +v; syncPrefs(); saveSettings(); toast(`Weeks start on ${+v ? "Monday" : "Sunday"}`); });
  pick("fLenC", v=>{ s.focus = { ...FS(), preset:+v }; syncPrefs(); saveSettings(); toast(`Focus sessions default to ${v} min`); });
  pick("fBrkC", v=>{ s.focus = { ...FS(), breakMin:+v }; saveSettings(); toast(`Breaks last ${v} min`); });
  $("#fAutoT").onclick = e=>{ s.focus = { ...FS(), autoDone:!FS().autoDone }; syncPrefs(); saveSettings(); e.currentTarget.setAttribute("aria-pressed", FS().autoDone); };
  $("#fSoundT").onclick = e=>{ s.focus = { ...FS(), sound:!FS().sound }; saveSettings(); e.currentTarget.setAttribute("aria-pressed", FS().sound); if(FS().sound) chime(); };
  $("#grpT").onclick = e=>{ s.groupByTag = !(s.groupByTag!==false); e.currentTarget.setAttribute("aria-pressed", s.groupByTag); saveSettings(); };
  $("#moodT").onclick = e=>{ s.mood = !s.mood; e.currentTarget.setAttribute("aria-pressed", s.mood); saveSettings(); };
  $("#startC").addEventListener("click", e=>{
    const b = e.target.closest(".chip"); if(!b) return;
    s.startTab = b.dataset.s; saveSettings();
    $("#startC").querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed", c===b));
  });
  $("#themeChoices").addEventListener("click", e=>{
    const b = e.target.closest("[data-theme]"); if(!b) return;
    s.theme = b.dataset.theme; saveSettings(); applyTheme(true);
    $("#themeChoices").querySelectorAll("[data-theme]").forEach(x=>x.setAttribute("aria-pressed", x===b));
  });
  $("#sw").addEventListener("click", e=>{
    const b = e.target.closest("button.sw"); if(!b) return;
    s.accent = b.dataset.c; saveSettings(); applyTheme(true);
    $("#sw").querySelectorAll(".sw").forEach(x=>x.setAttribute("aria-pressed", x===b));
  });
  $("#custom").addEventListener("input", e=>{
    s.accent = e.target.value; saveSettings(); applyTheme();
    $("#sw").querySelectorAll(".sw").forEach(x=>x.setAttribute("aria-pressed","false"));
  });
  if($("#startRest")) $("#startRest").onclick = ()=>{
    const to = $("#restTo").value || null;
    if(to && to < today()){ toast("Pick today or a later date"); return; }
    s.rest = [...(s.rest||[]), { from:today(), to }];
    saveSettings(); toast("Rest mode on — enjoy the break 🏖️"); viewSettings();
  };
  if($("#endRest")) $("#endRest").onclick = ()=>{ endRest(); viewSettings(); };
  $("#toExport").onclick = e=>{ e.preventDefault(); go("export"); };
  bindAppCard();
  if(pwa.usage==null) refreshStorageInfo().then(()=>{ if(state.tab==="settings" && pwa.usage!=null) viewSettings(); });

  const bindTagRows = () => {
    $("#tagList").querySelectorAll("[data-color]").forEach(inp=>inp.addEventListener("input", e=>{
      const t = tagList().find(x=>x.name===inp.dataset.color);
      if(t){ t.color = e.target.value; s.tags = tagList(); saveSettings(); }
    }));
    $("#tagList").querySelectorAll("[data-rmtag]").forEach(b=>b.addEventListener("click", ()=>{
      if(tagList().length <= 1){ toast("Keep at least one tag"); return; }
      s.tags = tagList().filter(x=>x.name!==b.dataset.rmtag);
      saveSettings(); $("#tagList").innerHTML = tagsHTML(); bindTagRows(); toast("Tag removed — tasks keep their label");
    }));
  };
  bindTagRows();
  const addTag = () => {
    const name = $("#newTag").value.trim().toLowerCase(); if(!name) return;
    if(tagList().some(t=>t.name===name)){ toast("That tag already exists"); return; }
    s.tags = [...tagList(), { name, color: tagColor(name).startsWith("#") ? tagColor(name) : "#7b9e8f" }];
    saveSettings(); $("#newTag").value = ""; $("#tagList").innerHTML = tagsHTML(); bindTagRows(); toast(`Added "${name}"`);
  };
  $("#addTag").onclick = addTag;
  $("#newTag").addEventListener("keydown", e=>{ if(e.key==="Enter") addTag(); });
}
$("#themeBtn2").addEventListener("click", ()=>$("#themeBtn").click());
$("#rotBtn").addEventListener("click", ()=>toggleRotation());
$("#themeBtn").addEventListener("click", ()=>{
  const order = ["system","light","dark"];
  state.settings.theme = order[(order.indexOf(state.settings.theme)+1)%3];
  saveSettings(); applyTheme(true); toast(`Theme: ${state.settings.theme}`);
});

/* ============================ PWA ============================ */
const pwa = { installEvt:null, updateReady:null, persisted:null, usage:null };
const isStandalone = () => { try{ return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone===true; }catch(e){ return false; } };
/* The browser itself decides what counts as secure — this also covers a local server
   allowed through Chrome's "Insecure origins treated as secure" flag. */
const canUseSW = () => "serviceWorker" in navigator &&
  (typeof isSecureContext === "boolean" ? isSecureContext
   : location.protocol==="https:" || ["localhost","127.0.0.1"].includes(location.hostname));
function offerUpdate(worker){
  pwa.updateReady = worker;
  toast("A new version is ready", "Update", ()=>worker.postMessage({ type:"SKIP_WAITING" }));
  if(state.tab==="settings") viewSettings();
}
if(canUseSW()){
  window.addEventListener("load", async ()=>{
    try{
      const reg = await navigator.serviceWorker.register("sw.js");
      if(reg.waiting && navigator.serviceWorker.controller) offerUpdate(reg.waiting);
      reg.addEventListener("updatefound", ()=>{
        const w = reg.installing; if(!w) return;
        w.addEventListener("statechange", ()=>{ if(w.state==="installed" && navigator.serviceWorker.controller) offerUpdate(w); });
      });
      let reloading = false;
      navigator.serviceWorker.addEventListener("controllerchange", ()=>{ if(reloading) return; reloading = true; location.reload(); });
      setInterval(()=>reg.update().catch(()=>{}), 60*60*1000);      // look for a new version hourly
    }catch(e){ /* offline or blocked — the app still works */ }
  });
}
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); pwa.installEvt = e; if(state.tab==="settings") viewSettings(); });
window.addEventListener("appinstalled", ()=>{ pwa.installEvt = null; toast("Installed 🎉 Daily Log is on your home screen"); protectStorage(); if(state.tab==="settings") viewSettings(); });
async function installApp(){
  if(!pwa.installEvt) return;
  pwa.installEvt.prompt();
  try{ await pwa.installEvt.userChoice; }catch(e){}
  pwa.installEvt = null;
  if(state.tab==="settings") viewSettings();
}
async function refreshStorageInfo(){
  try{
    if(navigator.storage && navigator.storage.persisted) pwa.persisted = await navigator.storage.persisted();
    if(navigator.storage && navigator.storage.estimate){ const e = await navigator.storage.estimate(); pwa.usage = e.usage || 0; }
  }catch(e){}
}
async function protectStorage(){
  try{
    if(navigator.storage && navigator.storage.persist){ pwa.persisted = await navigator.storage.persist(); }
  }catch(e){}
  return pwa.persisted;
}
function appCardHTML(){
  const installed = isStandalone();
  const status = installed ? "Running as an installed app ✓"
    : pwa.installEvt ? "Ready to install on this device"
    : canUseSW() ? "Install it from your browser menu"
    : "Open the hosted link to install";
  const how = installed ? ""
    : pwa.installEvt ? `<button class="btn wide" id="installBtn">Install Daily Log</button>`
    : canUseSW() ? `<p class="sub">On Android, open Chrome's <b>⋮</b> menu and tap <b>Install app</b> or <b>Add to Home screen</b>. On a computer, use the install icon at the right of the address bar.</p>`
    : `<p class="sub">Installing needs a secure address — <b>https://</b> or <b>localhost</b>. Right now this is <b>${esc(location.protocol + "//" + (location.host || "file"))}</b>, so the app runs but can't be installed or work offline.</p>`;
  const kb = pwa.usage==null ? "" : ` · using ${pwa.usage < 1048576 ? Math.max(1,Math.round(pwa.usage/1024)) + " KB" : (pwa.usage/1048576).toFixed(1) + " MB"}`;
  const protect = pwa.persisted===true ? `<p class="sub" style="margin-top:14px">🛡️ Your data is protected from automatic cleanup${kb}.</p>`
    : (navigator.storage && navigator.storage.persist) ? `<div class="switch" style="border-bottom:0;margin-top:6px"><span class="lbl">Protect my data<small>Asks the browser not to clear it when space runs low${kb}</small></span><button class="btn ghost tiny" id="persistBtn">Protect</button></div>` : "";
  const upd = pwa.updateReady ? `<button class="btn ghost wide" id="updateBtn" style="margin-top:12px">Update to the new version</button>` : "";
  return `<div class="card">
      <div class="card-head"><h2>App</h2><span>${installed ? "installed" : "web"}</span></div>
      <p class="sub" style="margin-bottom:${how?"14px":"0"}">${status}</p>
      ${how}${upd}${protect}
      ${isTouch() ? `<div class="switch" style="border-bottom:0;margin-top:4px"><span class="lbl">Allow rotation<small>Turn the phone sideways for the full desktop layout</small></span><button class="toggle" id="rotT" aria-pressed="${!!state.settings.rotate}" aria-label="Allow rotation"><i></i></button></div>` : ""}
      <p class="sub" style="margin-top:14px">Your data is saved in ${BACKEND_LABEL}. Backups and CSV files are on the <a href="#" id="toExport" style="color:var(--accent)">Export</a> screen.</p>
    </div>`;
}
function bindAppCard(){
  if($("#installBtn")) $("#installBtn").onclick = installApp;
  if($("#rotT")) $("#rotT").onclick = ()=>toggleRotation();
  if($("#updateBtn")) $("#updateBtn").onclick = ()=>pwa.updateReady && pwa.updateReady.postMessage({ type:"SKIP_WAITING" });
  if($("#persistBtn")) $("#persistBtn").onclick = async ()=>{
    const ok = await protectStorage(); await refreshStorageInfo();
    toast(ok ? "Protected 🛡️ your data won't be auto-cleared" : "The browser said no for now — installing the app usually allows it");
    viewSettings();
  };
}

/* ============================ rotation ============================ */
const isTouch = () => { try{ return matchMedia("(hover: none) and (pointer: coarse)").matches; }catch(e){ return false; } };
const canLock = () => !!(window.screen && screen.orientation && typeof screen.orientation.lock === "function");
function paintRotBtn(){
  const b = $("#rotBtn"); if(!b) return;
  const on = !!state.settings.rotate;
  b.setAttribute("aria-pressed", on);
  b.title = on ? "Rotation allowed — tap to lock to portrait" : "Locked to portrait — tap to allow rotation";
  b.classList.toggle("on", on);
}
async function applyOrientation(){
  if(!canLock()) return "unsupported";
  try{
    if(state.settings.rotate) screen.orientation.unlock();
    else await screen.orientation.lock("portrait");
    return "ok";
  }catch(e){ return "blocked"; }
}
async function toggleRotation(){
  state.settings.rotate = !state.settings.rotate;
  saveSettings(); paintRotBtn();
  if($("#rotT")) $("#rotT").setAttribute("aria-pressed", !!state.settings.rotate);
  const r = await applyOrientation();
  if(state.settings.rotate) toast(r==="ok" ? "Rotation on 🔄 turn sideways for the desktop layout" : "Rotation on — make sure auto-rotate is on in your quick settings");
  else toast(r==="ok" ? "Locked to portrait 🔒" : "Portrait lock works in the installed app — here, use your phone's rotation lock");
}

/* ============================ boot ============================ */
(async function boot(){
  const [st, tk] = await Promise.all([S.get(K.settings), S.get(K.tasks)]);
  if(st) Object.assign(state.settings, st);
  if(Array.isArray(tk)) state.tasks = tk;
  syncPrefs(); state.cursor = nowD();
  if(!state.tasks.length && !st){
    const seed = [["Move for 20 minutes","health","walk to the corner and back"],["Read a few pages","mind","read 1 page"],["Deep work block","work",""],["Tidy one small thing","home",""]];
    state.tasks = seed.map(([title,tag,mini])=>{ const t = { id:uid(), title, tag, repeat:"daily", created:today() }; if(mini) t.mini = mini; return t; });
    await saveTasks();
  }
  if(!Array.isArray(state.settings.tags) || !state.settings.tags.length){
    const tags = DEFAULT_TAGS.map(t=>({...t}));
    state.tasks.forEach(t=>{ if(!tags.some(x=>x.name===t.tag)) tags.push({ name:t.tag, color:"#7b9e8f" }); });
    state.settings.tags = tags; await saveSettings();
  }
  applyTheme();
  await ensureMonth(ymOf(today()));
  const n = await rollover();
  const linkTab = new URLSearchParams(location.search).get("tab");
  state.tab = TABS.some(t=>t[0]===linkTab) ? linkTab : (state.settings.startTab || "today");
  if(isStandalone()) protectStorage();
  paintRotBtn();
  if(isStandalone() && isTouch()) applyOrientation();
  paintRail(true);
  await go(state.tab);
  if(n) toast(`${n} unchecked task${n===1?"":"s"} from earlier days marked missed`);
  if(BACKEND==="memory") toast("Preview only — open the file in your browser to save data");
})();
</script>
